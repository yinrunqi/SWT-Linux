case: b04_keycap
title: B04 键帽（简化版）
prompt: 根据所附三视图（第三角画法，单位 mm）建模键帽，单一实体。
prompt_en: Model the keycap from the attached three-view drawing (third-angle projection, units in mm) as a single solid body.
image: eval/three_view/drawings/b04_keycap.png
reference: eval/three_view/references/b04_keycap.step
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

drawing:
  dims:
    - {view: front, a: [-9, -9, 0], b: [9, -9, 0], side: bottom, text: "18"}
    - {view: front, a: [-9, -9, 0], b: [-9, 9, 0], side: left, text: "18"}
    - {view: front, a: [-7, 7, 8], b: [7, 7, 8], side: top, text: "14"}
    - {view: front, a: [7, -7, 8], b: [7, 7, 8], side: right, text: "14"}
    - {view: right, a: [9, -9, 0], b: [9, -9, 8], side: bottom, text: "8"}
  axes:
    - {view: front, a: [0, -11, 0], b: [0, 11, 0]}
    - {view: front, a: [-11, 0, 0], b: [11, 0, 0]}
  notes: ["正四棱台：顶面与底面平行且中心对齐"]

# frame：轴 0 = 高度（底面低），轴 1、2 = 底面两边（对称）
entities:
  frame: {principal_frame: {signs: {0: larger_area_low}}}

rubrics:
  - id: solid
    source: 单一实体
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 主视图 18×18；右视图高 8
    hard: true
    check:
      - bbox_sorted: [8, 18, 18]

  - id: bottom_face
    source: 主视图：底面 18×18
    check:
      - end_face_shape: {frame: frame, axis: 0, side: low, rect: [18, 18]}

  - id: top_face
    source: 主视图：顶面 14×14，与底面中心对齐
    check:
      - end_face_shape: {frame: frame, axis: 0, side: high, rect: [14, 14]}
      - end_faces_coaxial: {frame: frame, axis: 0}

  - id: taper
    source: 右视图：侧面为平面斜面，从 18 线性收到 14
    derivation: 高度 z 处边长 18 − 0.5z：z = 2 → 17² = 289，z = 6 → 15² = 225
    check:
      - section_areas: {frame: frame, axis: 0, at: [2, 6], expect: [289, 225]}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: 棱台 h/3·(A1 + A2 + √(A1A2)) = 8/3·(324 + 196 + 252) = 2058.67
    check:
      - volume: 2058.67

ungraded: []
