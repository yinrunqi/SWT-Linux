case: d01_v_block
title: D01 V 形块
prompt: 根据所附三视图（第三角画法，单位 mm）建模 V 形块，单一实体。
prompt_en: Model the V-block from the attached three-view drawing (third-angle projection, units in mm) as a single solid body.
image: eval/three_view/drawings/d01_v_block.png
reference: eval/three_view/references/d01_v_block.step
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

drawing:
  dims:
    - {view: front, a: [-10, 0, 40], b: [10, 0, 40], side: bottom, tier: 1, text: "20"}
    - {view: front, a: [-40, 38, 40], b: [-35, 38, 40], side: bottom, tier: 1, text: "5"}
    - {view: front, a: [-40, 0, 40], b: [40, 0, 40], side: bottom, tier: 2, text: "80"}
    - {view: front, a: [-20, 50, 40], b: [20, 50, 40], side: top, tier: 1, text: "40"}
    - {view: front, a: [-2, 26, 40], b: [2, 26, 40], side: top, tier: 2, text: "4"}
    - {view: front, a: [-40, 30, 40], b: [-40, 38, 40], side: left, tier: 1, text: "8"}
    - {view: front, a: [-40, 0, 40], b: [-40, 30, 40], side: left, tier: 2, text: "30"}
    - {view: front, a: [-40, 0, 40], b: [-40, 50, 40], side: left, tier: 3, text: "50"}
    - {view: front, a: [10, 0, 40], b: [10, 6, 40], side: right, tier: 1, text: "6"}
    - {view: front, a: [40, 0, 40], b: [2, 26, 40], side: right, tier: 2, text: "26"}
    - {view: right, a: [40, 0, 40], b: [40, 0, 0], side: bottom, text: "40"}
  callouts:
    - {view: front, at: [0, 30, 40], r: 0, angle: 75, leader: 120, text: "V 形槽 90°"}
  axes:
    - {view: front, a: [0, -4, 40], b: [0, 54, 40]}
  notes:
    - "V 形槽、槽底让刀槽（宽 4）、底部通槽与两侧夹持槽均贯通前后；左右对称"

# frame：轴 0 = 长度方向 40（拉伸方向），轴 1 = 高度（底面低），轴 2 = 宽度 80
entities:
  frame: {principal_frame: {signs: {1: larger_area_low}}}

rubrics:
  - id: solid
    source: 单一实体
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 主视图 80、50；右视图 40
    hard: true
    check:
      - bbox_sorted: [40, 50, 80]

  - id: v_groove
    source: 主视图 V 形槽顶宽 40、槽角 90°
    derivation: 90° 槽在高 y 处半宽 = y − 30；斜面长 18√2、宽 40，面积 1018.23
    check:
      - line_material: {frame: frame, along: 2, at: [20, 45, null], expect: [[0, 25], [55, 80]]}
      - line_material: {frame: frame, along: 2, at: [20, 40, null], expect: [[0, 30], [50, 80]]}
      - planar_face: {frame: frame, axis: 1, angle: 45, area: 1018.23}

  - id: relief
    source: 主视图让刀槽宽 4，槽底高 26
    check:
      - line_material: {frame: frame, along: 2, at: [20, 27, null], expect: [[0, 38], [42, 80]]}
      - line_material: {frame: frame, along: 1, at: [20, null, 40], expect: [[6, 26]]}

  - id: bottom_slot
    source: 主视图底部通槽宽 20、深 6
    check:
      - line_material: {frame: frame, along: 2, at: [20, 3, null], expect: [[0, 30], [50, 80]]}
      - line_material: {frame: frame, along: 2, at: [20, 5.9, null], expect: [[0, 30], [50, 80]]}
      - line_material: {frame: frame, along: 2, at: [20, 6.1, null], expect: [[0, 80]]}

  - id: side_grooves
    source: 主视图两侧夹持槽宽 8、深 5，槽下沿高 30
    check:
      - line_material: {frame: frame, along: 1, at: [20, null, 2], expect: [[0, 30], [38, 50]]}
      - line_material: {frame: frame, along: 1, at: [20, null, 4.9], expect: [[0, 30], [38, 50]]}
      - line_material: {frame: frame, along: 1, at: [20, null, 5.1], expect: [[0, 50]]}
      - line_material: {frame: frame, along: 1, at: [20, null, 78], expect: [[0, 30], [38, 50]]}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: 截面 80×50 − 120 − 2×40 − 400 − 20 = 3380，×40 = 135200
    check:
      - volume: 135200.0

ungraded: []
