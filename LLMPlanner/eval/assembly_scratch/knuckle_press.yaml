case_id: knuckle_press
title: 肘杆压力机
# 曲柄—连杆—肘节（三件共用肘销）—压头，14/42 齿轮；检查压头行程与上肘杆摆角。
# 由 bench_cases2.py 生成，改测例请改那里再运行 write。
parts:
- id: kp_frame
  extra_tools: []
  prompt: |
    创建机身板：在 front_plane 上画矩形，X 从 -150 到 40 mm，Y 从 -70 到 130 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(-100,50) 直径 10 mm，(-100,-6) 直径 10 mm，(0,100) 直径 8 mm。不要抽壳。
- id: kp_shaft
  extra_tools: []
  prompt: |
    创建传动轴：直径 10 mm、长 22 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: kp_gear
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 42，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: kp_pinion
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 14，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: kp_flywheel
  extra_tools: []
  prompt: |
    创建飞轮：外径 70 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 10 mm。另开贯穿孔：(22,0) 直径 8 mm，(-22,0) 直径 8 mm。
- id: kp_crank
  extra_tools: []
  prompt: |
    创建曲柄：在 front_plane 上画两端圆头的长条，宽 20 mm，两端半圆的圆心分别在原点和 (15,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 10 mm，X=15 处直径 8 mm。
- id: kp_crank_pin
  extra_tools: []
  prompt: |
    创建曲柄销：直径 8 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: kp_rod
  extra_tools: []
  prompt: |
    创建连杆：在 front_plane 上画两端圆头的长条，宽 14 mm，两端半圆的圆心分别在原点和 (90,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 8 mm，X=90 处直径 8 mm。
- id: kp_upper
  extra_tools: []
  prompt: |
    创建上肘杆：在 front_plane 上画两端圆头的长条，宽 16 mm，两端半圆的圆心分别在原点和 (50,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 8 mm，X=50 处直径 8 mm。
- id: kp_lower
  extra_tools: []
  prompt: |
    创建下肘杆：在 front_plane 上画两端圆头的长条，宽 16 mm，两端半圆的圆心分别在原点和 (60,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 8 mm，X=60 处直径 6 mm。
- id: kp_top_pin
  extra_tools: []
  prompt: |
    创建上铰销：直径 8 mm、长 26 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: kp_knee_pin
  extra_tools: []
  prompt: |
    创建肘销：直径 8 mm、长 18 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: kp_ram_pin
  extra_tools: []
  prompt: |
    创建滑块销：直径 6 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: kp_ram
  extra_tools: []
  prompt: |
    创建压头：在 front_plane 上画矩形，X 从 -20 到 20 mm，Y 从 -12 到 12 mm，向 +Z 拉伸 6 mm。
    开贯穿孔：(0,0) 直径 6 mm。不要抽壳。
gold_roles:
  frame: kp_frame
  crank_shaft: kp_shaft
  crank_gear: kp_gear
  crank: kp_crank
  crank_pin: kp_crank_pin
  motor_shaft: kp_shaft
  pinion: kp_pinion
  flywheel: kp_flywheel
  rod: kp_rod
  top_pin: kp_top_pin
  upper: kp_upper
  knee_pin: kp_knee_pin
  lower: kp_lower
  ram_pin: kp_ram_pin
  ram: kp_ram
assembly:
  prompt: |
    装配肘杆（肘节）压力机：曲柄经连杆推动肘节，上下两根肘杆接近伸直时压头产生大压力。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - frame 固定，z∈[0,8]。曲柄轴孔 (-100,50)、电机轴孔 (-100,-6) 直径 10；上铰孔 (0,100) 直径 8。
    - crank_shaft 穿过曲柄轴孔绕 Z 转动（z∈[-8,14]）；42 齿 crank_gear 固定在其上（z∈[-8,0]），crank 的 10 mm 孔固定在其上（z∈[8,14]）；
      crank_pin 固定在 crank 的 8 mm 孔里（z∈[8,20]）。
    - motor_shaft 穿过电机轴孔绕 Z 转动（z∈[-14,8]）；14 齿 pinion（z∈[-8,0]）与 flywheel 的中心孔（z∈[-14,-8]）固定在其上，
      pinion 与 crank_gear 外啮合（模数 2，中心距 56）。
    - rod 的原点孔套在 crank_pin 上转动（z∈[14,20]）。top_pin 固定在上铰孔里（z∈[0,26]），upper 的原点孔套在 top_pin 上转动（z∈[20,26]）。
    - knee_pin 固定在 upper 的另一个孔里（z∈[8,26]）；rod 的另一个孔、lower 的原点孔（z∈[8,14]）都套在 knee_pin 上转动。肘节在 upper 轴线的下方。
    - ram_pin 固定在 lower 的 6 mm 孔里（z∈[8,20]）；ram 的孔套在 ram_pin 上转动（z∈[14,20]），只能沿 frame 的 Y 方向移动，
      孔心始终在 x=0 的直线上、肘节下方。
    - 曲柄 15、连杆 90、上肘杆 50、下肘杆 60。曲柄一整圈：upper 摆角约 36.2°，压头行程约 12.5 mm。各齿轮互不穿模，啮合齿相位要对上。
    对 crank_shaft 做 check_motion（一整圈），确认无穿模后再保存。
motion:
  driver: crank_shaft
  sweep_deg: 360
  frames: 13
  rpm: 10
  expect_fixed:
  - frame
  expect_moving:
  - crank
  - rod
  - upper
  - lower
  - ram
  - motor_shaft
  ratios:
  - role: motor_shaft
    ratio: 0.3333333333333333
    same_direction: false
  swings:
  - role: upper
    deg: 36.16
  strokes:
  - role: ram
    axis: y
    mm: 12.49
  max_interference: 0
