case_id: quick_return_shaper
title: 牛头刨急回机构
# 摆动导杆急回 + 连杆滑枕，12/36 齿轮；检查摆角、滑枕行程与电机轴 3 倍转速。
# 由 bench_cases2.py 生成，改测例请改那里再运行 write。
parts:
- id: qr_frame
  extra_tools: []
  prompt: |
    创建床身板：在 front_plane 上画矩形，X 从 -100 到 150 mm，Y 从 -100 到 87 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 10 mm，(-48,0) 直径 10 mm，(0,-60) 直径 8 mm。不要抽壳。
- id: qr_shaft
  extra_tools: []
  prompt: |
    创建传动轴：直径 10 mm、长 22 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: qr_gear
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 36，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: qr_pinion
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 12，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: qr_handwheel
  extra_tools: []
  prompt: |
    创建手轮：外径 50 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 10 mm。另开贯穿孔：(16,0) 直径 6 mm。
- id: qr_crank
  extra_tools: []
  prompt: |
    创建曲柄：在 front_plane 上画两端圆头的长条，宽 20 mm，两端半圆的圆心分别在原点和 (25,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 10 mm，X=25 处直径 8 mm。
- id: qr_crank_pin
  extra_tools: []
  prompt: |
    创建曲柄销：直径 8 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: qr_block
  extra_tools: []
  prompt: |
    创建滑块：在 front_plane 上画矩形，X 从 -14 到 14 mm，Y 从 -8 到 8 mm，向 +Z 拉伸 6 mm。
    开贯穿孔：(0,0) 直径 8 mm。不要抽壳。
- id: qr_pivot
  extra_tools: []
  prompt: |
    创建摆杆轴：直径 8 mm、长 26 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: qr_lever
  extra_tools: []
  prompt: |
    创建摆杆：在 front_plane 上画两端圆头的长条，宽 16 mm，两端半圆的圆心分别在原点和 (140,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 8 mm，X=140 处直径 6 mm。
- id: qr_pin12
  extra_tools: []
  prompt: |
    创建铰销：直径 6 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: qr_rod
  extra_tools: []
  prompt: |
    创建连杆：在 front_plane 上画两端圆头的长条，宽 12 mm，两端半圆的圆心分别在原点和 (50,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=50 处直径 6 mm。
- id: qr_ram
  extra_tools: []
  prompt: |
    创建滑枕：在 front_plane 上画矩形，X 从 -30 到 30 mm，Y 从 -8 到 8 mm，向 +Z 拉伸 6 mm。
    开贯穿孔：(0,0) 直径 6 mm。不要抽壳。
gold_roles:
  frame: qr_frame
  crank_shaft: qr_shaft
  crank_gear: qr_gear
  crank: qr_crank
  crank_pin: qr_crank_pin
  motor_shaft: qr_shaft
  pinion: qr_pinion
  handwheel: qr_handwheel
  pivot: qr_pivot
  lever: qr_lever
  block: qr_block
  tip_pin: qr_pin12
  rod: qr_rod
  ram_pin: qr_pin12
  ram: qr_ram
assembly:
  prompt: |
    装配牛头刨床的急回机构：曲柄带滑块在摆杆上滑动，摆杆顶端经连杆推动滑枕往复，工作行程慢、回程快。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - frame 固定，z∈[0,8]。曲柄轴孔 (0,0)、电机轴孔 (-48,0) 直径 10，摆杆轴孔 (0,-60) 直径 8。
    - crank_shaft 穿过 (0,0) 孔绕 Z 转动（z∈[-8,14]）；36 齿 crank_gear 固定在其上（z∈[-8,0]），crank 的 10 mm 孔固定在其上（z∈[8,14]）。
      crank_pin 固定在 crank 的 8 mm 孔里（z∈[8,20]）。
    - motor_shaft 穿过 (-48,0) 孔绕 Z 转动（z∈[-14,8]）；12 齿 pinion（z∈[-8,0]）与 handwheel 的中心孔（z∈[-14,-8]）固定在其上。
      pinion 与 crank_gear 外啮合（模数 2，中心距 48），减速比 3。
    - pivot 固定在 (0,-60) 孔里（z∈[0,26]）；lever 的 8 mm 孔套在 pivot 上转动（z∈[20,26]）。
    - block 的孔套在 crank_pin 上转动（z∈[14,20]），同时只能沿 lever 的杆身方向滑动：block 孔心始终在 lever 两孔连线上、两者长边平行。
    - tip_pin 固定在 lever 的 6 mm 孔里（z∈[20,32]）；rod 的原点孔套在 tip_pin 上转动（z∈[26,32]）；
      ram_pin 固定在 rod 的另一个孔里（z∈[26,38]）；ram 的孔套在 ram_pin 上转动（z∈[32,38]），只能沿 frame 的 X 方向移动，
      孔心始终在 y=95 的直线上（ram 的下沿面与 frame 的上沿面 y=87 平齐），位于 tip_pin 的 +X 侧。
    - 曲柄 25、摆杆 140（轴心距曲柄轴 60）、连杆 50。曲柄一整圈：摆杆摆角约 49.2°，滑枕行程约 116.7 mm。各齿轮互不穿模，啮合齿相位要对上。
    对 crank_shaft 做 check_motion（一整圈），确认无穿模后再保存。
motion:
  driver: crank_shaft
  sweep_deg: 360
  frames: 13
  rpm: 10
  expect_fixed:
  - frame
  expect_moving:
  - crank
  - block
  - lever
  - rod
  - ram
  - motor_shaft
  ratios:
  - role: motor_shaft
    ratio: 0.3333333333333333
    same_direction: false
  swings:
  - role: lever
    deg: 49.25
  strokes:
  - role: ram
    axis: x
    mm: 116.67
  max_interference: 0
