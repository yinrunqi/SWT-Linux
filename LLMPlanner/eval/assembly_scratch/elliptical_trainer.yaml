case_id: elliptical_trainer
title: 椭圆机
# 两套曲柄—踏板连杆—摆杆扶手四杆，曲柄相差 180°，板前板后各一套；检查扶手摆角与脚踏板轨迹。
# 由 bench_cases2.py 生成，改测例请改那里再运行 write。
parts:
- id: et_frame
  extra_tools: []
  prompt: |
    创建机架板：在 front_plane 上画矩形，X 从 -60 到 330 mm，Y 从 -50 到 240 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 10 mm，(190,100) 直径 10 mm。不要抽壳。
- id: et_shaft
  extra_tools: []
  prompt: |
    创建曲柄轴：直径 10 mm、长 28 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: et_flywheel
  extra_tools: []
  prompt: |
    创建飞轮：外径 120 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 10 mm。另开贯穿孔：(40,0) 直径 14 mm，(-40,0) 直径 14 mm，(0,40) 直径 14 mm，(0,-40) 直径 14 mm。
- id: et_crank
  extra_tools: []
  prompt: |
    创建曲柄：在 front_plane 上画两端圆头的长条，宽 20 mm，两端半圆的圆心分别在原点和 (25,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 10 mm，X=25 处直径 8 mm。
- id: et_pin8
  extra_tools: []
  prompt: |
    创建铰销：直径 8 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: et_pedal
  extra_tools: []
  prompt: |
    创建踏板连杆：在 front_plane 上画两端圆头的长条，宽 16 mm，两端半圆的圆心分别在原点和 (200,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 8 mm，X=120 处直径 8 mm，X=200 处直径 8 mm。
- id: et_rocker
  extra_tools: []
  prompt: |
    创建摆杆扶手：在 front_plane 上画两端圆头的长条，宽 14 mm，两端半圆的圆心分别在原点和 (220,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 8 mm，X=100 处直径 10 mm。
- id: et_pivot
  extra_tools: []
  prompt: |
    创建摆杆轴：直径 10 mm、长 52 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: et_foot
  extra_tools: []
  prompt: |
    创建脚踏板：在 front_plane 上画矩形，X 从 -35 到 35 mm，Y 从 -8 到 8 mm，向 +Z 拉伸 6 mm。
    开贯穿孔：(0,0) 直径 8 mm。不要抽壳。
gold_roles:
  frame: et_frame
  shaft: et_shaft
  flywheel: et_flywheel
  pivot: et_pivot
  crank_f: et_crank
  cpin_f: et_pin8
  pedal_f: et_pedal
  dpin_f: et_pin8
  rocker_f: et_rocker
  fpin_f: et_pin8
  foot_f: et_foot
  crank_b: et_crank
  cpin_b: et_pin8
  pedal_b: et_pedal
  dpin_b: et_pin8
  rocker_b: et_rocker
  fpin_b: et_pin8
  foot_b: et_foot
assembly:
  prompt: |
    装配椭圆机（左右两套踏板机构共用曲柄轴、曲柄相差 180°，脚踏板走椭圆轨迹、扶手前后摆动）。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - frame 固定，z∈[0,8]。曲柄轴孔 (0,0)、摆杆轴孔 (190,100)，直径都是 10。
    - shaft 穿过 (0,0) 孔绕 Z 转动（z∈[-14,14]）；flywheel 的中心孔固定在 shaft 上（z∈[-8,-2]）。
      pivot 固定在摆杆轴孔里、两面伸出（z∈[-26,26]）。
    - 前侧（板前）：crank_f 的 10 mm 孔固定在 shaft 上（z∈[8,14]）；cpin_f 固定在 crank_f 的 8 mm 孔里（z∈[8,20]）；
      pedal_f 的原点孔套在 cpin_f 上转动（z∈[14,20]）；dpin_f 固定在 pedal_f 的 X=200 孔里（z∈[14,26]）；
      rocker_f 的 10 mm 孔套在 pivot 上转动、8 mm 原点孔套在 dpin_f 上（z∈[20,26]），扶手段朝上伸出；
      fpin_f 固定在 pedal_f 的 X=120 孔里（z∈[8,20]），foot_f 的孔固定在 fpin_f 上（z∈[8,14]），长边沿 pedal_f 方向。
    - 后侧（板后）同样一套，z 方向镜像：crank_b z∈[-14,-8]，方向与 crank_f 相差 180°；cpin_b z∈[-20,-8]；pedal_b z∈[-20,-14]；
      dpin_b z∈[-26,-14]；rocker_b z∈[-26,-20]；fpin_b z∈[-20,-8]；foot_b z∈[-14,-8]。
    - 两侧 rocker 的 8 mm 孔都在 pivot 下方。曲柄 25、踏板连杆 200、摆杆下段 100。
      曲柄一整圈：扶手摆角约 29.1°，脚踏板中心 X 向行程约 50.0 mm、Y 向约 20.2 mm，两侧交替。
    对 shaft 做 check_motion（一整圈），确认无穿模后再保存。
motion:
  driver: shaft
  sweep_deg: 360
  frames: 13
  rpm: 10
  expect_fixed:
  - frame
  expect_moving:
  - crank_f
  - pedal_f
  - pedal_b
  - rocker_f
  - rocker_b
  - foot_f
  - foot_b
  swings:
  - role: rocker_f
    deg: 29.06
  - role: rocker_b
    deg: 29.06
  strokes:
  - role: foot_f
    axis: x
    mm: 49.95
  - role: foot_f
    axis: y
    mm: 20.2
  - role: foot_b
    axis: x
    mm: 49.95
  antiphase:
  - roles:
    - foot_f
    - foot_b
    axis: x
  max_interference: 0
