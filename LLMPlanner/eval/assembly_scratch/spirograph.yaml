case_id: spirograph
title: 万花尺
# 固定内齿圈 60 + 两只 20 齿行星（笔偏心 24 / 12）+ 齿轮驱动行星架；检查行星架与行星轮的转速、转向。
# 由 bench_cases2.py 生成，改测例请改那里再运行 write。
parts:
- id: sg_frame
  extra_tools: []
  prompt: |
    创建底板：在 front_plane 上画矩形，X 从 -90 到 90 mm，Y 从 -110 到 80 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 10 mm，(0,-60) 直径 10 mm。不要抽壳。
- id: sg_carrier_shaft
  extra_tools: []
  prompt: |
    创建行星架轴：直径 10 mm、长 28 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: sg_carrier_gear
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 45，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: sg_motor_shaft
  extra_tools: []
  prompt: |
    创建电机轴：直径 10 mm、长 22 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: sg_pinion
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 15，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: sg_handwheel
  extra_tools: []
  prompt: |
    创建手轮：外径 40 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 10 mm。另开贯穿孔：(12,0) 直径 6 mm。
- id: sg_ring
  extra_tools:
  - internal_gear
  prompt: |
    创建渐开线内齿圈，模数 1.5 mm，齿数 60，压力角 30°，齿宽 6 mm，外径 110 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 internal_gear。
- id: sg_arm
  extra_tools: []
  prompt: |
    创建行星架：在 front_plane 上画两端圆头的长条，宽 14 mm，两端半圆的圆心分别在原点和 (60,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=30 处直径 10 mm，X=60 处直径 6 mm。
- id: sg_planet
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 1.5 mm，齿数 20，压力角 30°，齿宽 6 mm，轴孔直径 6 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: sg_axle
  extra_tools: []
  prompt: |
    创建行星轴：直径 6 mm、长 18 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: sg_pen_arm_a
  extra_tools: []
  prompt: |
    创建笔杆 A：在 front_plane 上画两端圆头的长条，宽 10 mm，两端半圆的圆心分别在原点和 (24,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=24 处直径 4 mm。
- id: sg_pen_arm_b
  extra_tools: []
  prompt: |
    创建笔杆 B：在 front_plane 上画两端圆头的长条，宽 10 mm，两端半圆的圆心分别在原点和 (12,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=12 处直径 4 mm。
- id: sg_pen
  extra_tools: []
  prompt: |
    创建笔：直径 4 mm、长 16 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
gold_roles:
  frame: sg_frame
  carrier_shaft: sg_carrier_shaft
  carrier_gear: sg_carrier_gear
  motor_shaft: sg_motor_shaft
  pinion: sg_pinion
  handwheel: sg_handwheel
  ring: sg_ring
  arm: sg_arm
  planet_a: sg_planet
  axle_a: sg_axle
  pen_arm_a: sg_pen_arm_a
  pen_a: sg_pen
  planet_b: sg_planet
  axle_b: sg_axle
  pen_arm_b: sg_pen_arm_b
  pen_b: sg_pen
assembly:
  prompt: |
    装配万花尺（内齿圈固定，两只行星轮在圈内滚动，各带一支笔画内摆线花样）。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - frame 固定，z∈[0,8]。中心孔 (0,0)、电机轴孔 (0,-60)，直径 10。60 齿内齿圈 ring（模数 1.5）固定在 frame 上、与中心孔同轴（z∈[8,14]）。
    - carrier_shaft 穿过中心孔绕 Z 转动（z∈[-8,20]）；45 齿 carrier_gear（模数 2）固定在其上（z∈[-8,0]）；
      arm（三孔：0、30、60）的 X=30 孔固定在 carrier_shaft 上（z∈[14,20]）。
    - motor_shaft 穿过电机轴孔绕 Z 转动（z∈[-14,8]）；15 齿 pinion（模数 2，z∈[-8,0]）与 handwheel 的中心孔（z∈[-14,-8]）固定在其上，
      pinion 与 carrier_gear 外啮合（中心距 60）。
    - axle_a、axle_b 分别插在 arm 的 X=0、X=60 孔里绕 Z 转动（z∈[8,26]）；20 齿 planet_a/planet_b（模数 1.5）固定在对应轴上（z∈[8,14]），
      都与 ring 内啮合（中心距 30）。
    - pen_arm_a（长 24）、pen_arm_b（长 12）的 6 mm 孔分别固定在 axle_a、axle_b 上（z∈[20,26]）；pen_a、pen_b 固定在笔杆另一端 4 mm 孔里（z∈[20,36]）。
    - 电机转 3 圈行星架反向转 1 圈；行星轮绝对转速是行星架的 2 倍、反向（与电机同向）。各齿轮互不穿模，啮合齿相位要对上。
    对 motor_shaft 做 check_motion（一整圈），确认无穿模后再保存。
motion:
  driver: motor_shaft
  sweep_deg: 360
  frames: 13
  rpm: 10
  expect_fixed:
  - frame
  - ring
  expect_moving:
  - carrier_shaft
  - arm
  - planet_a
  - planet_b
  - pen_a
  - pen_b
  ratios:
  - role: arm
    ratio: 3
    same_direction: false
  - role: planet_a
    ratio: 1.5
    same_direction: true
  - role: pen_arm_b
    ratio: 1.5
    same_direction: true
  max_interference: 0
