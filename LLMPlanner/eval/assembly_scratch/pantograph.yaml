case_id: pantograph
title: 2 倍缩放仪（多位姿）
# 平行四边形缩放连杆，活动度 2；三个位姿检查 A、T、P 点，P = 2T。
# 由 bench_cases.py 生成，改测例请改那里再运行 write。
parts:
- id: pg_base
  extra_tools: []
  prompt: |
    创建底座：在 front_plane 上画矩形，X 从 -30 到 30 mm，Y 从 -30 到 30 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 6 mm。不要抽壳。
- id: pg_long_bar
  extra_tools: []
  prompt: |
    创建长杆：在 front_plane 上画两端圆头的长条，宽 10 mm，两端半圆的圆心分别在原点和 (120,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=60 处直径 6 mm，X=120 处直径 6 mm。
- id: pg_short_bar
  extra_tools: []
  prompt: |
    创建短杆：在 front_plane 上画两端圆头的长条，宽 10 mm，两端半圆的圆心分别在原点和 (60,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=60 处直径 6 mm。
- id: pg_pin14
  extra_tools: []
  prompt: |
    创建支点销：直径 6 mm、长 14 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: pg_pin12
  extra_tools: []
  prompt: |
    创建铰销：直径 6 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
gold_roles:
  base: pg_base
  pin_o: pg_pin14
  bar1: pg_long_bar
  bar2: pg_long_bar
  bar3: pg_short_bar
  bar4: pg_short_bar
  pin_c: pg_pin12
  pin_a: pg_pin12
  pin_d: pg_pin12
  pin_t: pg_pin12
assembly:
  prompt: |
    装配 2 倍缩放仪（平行四边形连杆）。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - base 固定，z∈[0,8]，支点孔 (0,0)。pin_o 固定在支点孔（z∈[0,14]）；bar1 的原点孔套在 pin_o 上转动（z∈[8,14]）。
    - pin_c、pin_a 分别固定在 bar1 的 X=60、X=120 孔里（z∈[8,20]）。
    - bar2 的原点孔套在 pin_a 上转动（z∈[14,20]）；bar3 的原点孔套在 pin_c 上转动（z∈[14,20]）。
    - pin_d 固定在 bar2 的 X=60 孔（z∈[14,26]），pin_t 固定在 bar3 的 X=60 孔（z∈[14,26]）；
      bar4 两端孔分别套在 pin_t 与 pin_d 上（z∈[20,26]）。bar3 与 bar2 平行、bar4 与 bar1 平行，
      bar3 远端（描点 T）与 bar2 远端（笔尖 P）始终满足 P = 2·T（以支点为原点）。
    - 两个转角保持自由（活动度 2），不要固定。各杆互不穿模，装好后保存。
motion:
  mode: poses
  frame: base
  expect_fixed:
  - base
  tolerance_mm: 1.5
  max_interference: 0
  poses:
  - name: a
    set:
    - type: angle
      a: bar1:plane(top)
      b: base:plane(top)
      angle_deg: 30.0
      points:
      - role: bar1
        local:
        - 120.0
        - 0.0
        - 0
        expect:
          x: 103.92
          y: 60.0
    - type: angle
      a: bar2:plane(top)
      b: bar1:plane(top)
      angle_deg: 80.0
      points:
      - role: bar2
        local:
        - 120.0
        - 0.0
        - 0
        expect:
          x: 62.88
          y: 172.76
      - role: bar3
        local:
        - 60.0
        - 0.0
        - 0
        expect:
          x: 31.44
          y: 86.38
  - name: b
    set:
    - type: angle
      a: bar1:plane(top)
      b: base:plane(top)
      angle_deg: 10.0
      points:
      - role: bar1
        local:
        - 120.0
        - 0.0
        - 0
        expect:
          x: 118.18
          y: 20.84
    - type: angle
      a: bar2:plane(top)
      b: bar1:plane(top)
      angle_deg: 100.0
      points:
      - role: bar2
        local:
        - 120.0
        - 0.0
        - 0
        expect:
          x: 77.13
          y: 133.6
      - role: bar3
        local:
        - 60.0
        - 0.0
        - 0
        expect:
          x: 38.57
          y: 66.8
  - name: c
    set:
    - type: angle
      a: bar1:plane(top)
      b: base:plane(top)
      angle_deg: 50.0
      points:
      - role: bar1
        local:
        - 120.0
        - 0.0
        - 0
        expect:
          x: 77.13
          y: 91.93
    - type: angle
      a: bar2:plane(top)
      b: bar1:plane(top)
      angle_deg: 70.0
      points:
      - role: bar2
        local:
        - 120.0
        - 0.0
        - 0
        expect:
          x: 17.13
          y: 195.85
      - role: bar3
        local:
        - 60.0
        - 0.0
        - 0
        expect:
          x: 8.57
          y: 97.92
