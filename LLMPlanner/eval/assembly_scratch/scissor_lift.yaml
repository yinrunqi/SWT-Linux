case_id: scissor_lift_3stage
title: 三级剪叉升降台（多位姿）
# 三级剪叉 + 底部滑块 + 顶部滑块平台，21 个组件、活动度 1；三个滑块偏距检查平台与各级铰点。
# 由 bench_cases2.py 生成，改测例请改那里再运行 write。
parts:
- id: sl_frame
  extra_tools: []
  prompt: |
    创建立板：在 front_plane 上画矩形，X 从 -40 到 170 mm，Y 从 -30 到 330 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 6 mm。不要抽壳。
- id: sl_arm
  extra_tools: []
  prompt: |
    创建剪叉臂：在 front_plane 上画两端圆头的长条，宽 12 mm，两端半圆的圆心分别在原点和 (120,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=60 处直径 6 mm，X=120 处直径 6 mm。
- id: sl_pin12
  extra_tools: []
  prompt: |
    创建铰销：直径 6 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: sl_pin18
  extra_tools: []
  prompt: |
    创建滑块销：直径 6 mm、长 18 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: sl_pin20
  extra_tools: []
  prompt: |
    创建底铰销：直径 6 mm、长 20 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: sl_block
  extra_tools: []
  prompt: |
    创建滑块：在 front_plane 上画矩形，X 从 -10 到 10 mm，Y 从 -8 到 8 mm，向 +Z 拉伸 6 mm。
    开贯穿孔：(0,0) 直径 6 mm。不要抽壳。
- id: sl_platform
  extra_tools: []
  prompt: |
    创建平台：在 front_plane 上画矩形，X 从 -20 到 140 mm，Y 从 -8 到 8 mm，向 +Z 拉伸 6 mm。
    开贯穿孔：(0,0) 直径 6 mm。不要抽壳。
gold_roles:
  frame: sl_frame
  base_pin: sl_pin20
  slider: sl_block
  slider_pin: sl_pin18
  top_pin: sl_pin12
  platform: sl_platform
  tb_pin: sl_pin12
  tblock: sl_block
  a1: sl_arm
  b1: sl_arm
  c1: sl_pin12
  a2: sl_arm
  b2: sl_arm
  c2: sl_pin12
  a3: sl_arm
