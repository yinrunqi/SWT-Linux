        - 0
        expect:
          x: 99.9
          y: 4.51
  - name: high
    set:
    - type: angle
      a: crank:plane(top)
      b: frame:plane(top)
      angle_deg: 90.0
      points:
      - role: dp
        local:
        - 50.0
        - 0.0
        - 0
        expect:
          x: 93.75
          y: 93.75
      - role: ob
        local:
        - 100.0
