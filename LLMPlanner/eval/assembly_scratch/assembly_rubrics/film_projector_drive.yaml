# 装配级 rubric：角色名与 projector.yaml 的 gold_roles 一致。
case_id: film_projector_drive
ground: frame
mobility: 1

bodies:
  frame: [frame]
  drive: [drive_shaft, drive_gear, drive_pinion]
  idler: [idler_shaft, idler_gear]
  shutter: [shutter_shaft, shutter_gear, shutter]
  sprocket: [sprocket_shaft, sprocket_gear, sprocket]

joints:
  - {bodies: [drive, frame], type: revolute}
  - {bodies: [idler, frame], type: revolute}
  - {bodies: [shutter, frame], type: revolute}
  - {bodies: [sprocket, frame], type: revolute}

couplings:
  - {type: gear, a: drive_gear, b: idler_gear, teeth: [24, 18], module_mm: 1.5, external: true}
  - {type: gear, a: idler_gear, b: shutter_gear, teeth: [18, 24], module_mm: 1.5, external: true}
  - {type: gear, a: drive_pinion, b: sprocket_gear, teeth: [16, 64], module_mm: 1.5, external: true}

center_distance_tol_mm: 0.2
