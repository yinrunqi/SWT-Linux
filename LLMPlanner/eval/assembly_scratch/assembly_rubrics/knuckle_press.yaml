# 装配级 rubric：角色名与 knuckle_press.yaml 的 gold_roles 一致（由 bench_cases2.py 生成）。
case_id: knuckle_press
ground: frame
mobility: 1
bodies:
  frame: [frame]
  crank: [crank_shaft, crank_gear, crank]
  motor: [motor_shaft, pinion, flywheel]
  rod: [rod]
  upper: [upper, knee_pin]
  lower: [lower]
  ram: [ram]
flex:
  crank_pin: [crank, rod]
  top_pin: [frame, upper]
  ram_pin: [lower, ram]
joints:
- bodies: [crank, frame]
  type: revolute
- bodies: [motor, frame]
  type: revolute
- bodies: [rod, crank]
  type: revolute
- bodies: [upper, frame]
  type: revolute
- bodies: [rod, upper]
  type: [revolute, cylindrical]
- bodies: [lower, upper]
  type: revolute
- bodies: [ram, lower]
  type: revolute
- bodies: [ram, frame]
  type: [slider, planar]
couplings:
- type: gear
  a: crank_gear
  b: pinion
  teeth: [42, 14]
  module_mm: 2
  external: true
center_distance_tol_mm: 0.2
