# 装配级 rubric：角色名与 planetary_mixer.yaml 的 gold_roles 一致（由 bench_cases2.py 生成）。
case_id: planetary_mixer
ground: frame
mobility: 1
bodies:
  frame: [frame, post, sun]
  carrier: [carrier_gear, arm]
  motor: [motor_shaft, pinion, handwheel]
  planet_a: [planet_a, axle_a, beater_a]
  planet_b: [planet_b, axle_b, beater_b]
joints:
- bodies: [motor, frame]
  type: revolute
- bodies: [carrier, frame]
  type: revolute
- bodies: [planet_a, carrier]
  type: revolute
- bodies: [planet_b, carrier]
  type: revolute
couplings:
- type: gear
  a: pinion
  b: carrier_gear
  teeth: [16, 48]
  module_mm: 2
  external: true
- type: gear
  a: sun
  b: planet_a
  teeth: [24, 24]
  module_mm: 2
  external: true
- type: gear
  a: sun
  b: planet_b
  teeth: [24, 24]
  module_mm: 2
  external: true
center_distance_tol_mm: 0.2
