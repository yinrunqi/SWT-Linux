# 装配级 rubric：角色名与 drill_gearbox.yaml 的 gold_roles 一致。
# 齿轮耦合按节点无滑滚动写进活动度（行星架转动时也正确），内啮合 external: false，中心距 m(z2−z1)/2。
case_id: drill_planetary_gearbox
ground: housing
mobility: 1

bodies:
  frame: [housing, ring1, ring2]
  input: [input_shaft, sun1]
  planet1: [planet1]
  carrier1: [carrier1, sun2]
  planet2: [planet2]
  output: [carrier2, output_shaft]

joints:
  - {bodies: [input, frame], type: revolute}
  - {bodies: [carrier1, frame], type: revolute}
  - {bodies: [output, frame], type: revolute}
  - {bodies: [planet1, carrier1], type: revolute}
  - {bodies: [planet2, output], type: revolute}

couplings:
  - {type: gear, a: sun1, b: planet1, teeth: [12, 18], module_mm: 1.2, external: true}
  - {type: gear, a: planet1, b: ring1, teeth: [18, 48], module_mm: 1.2, external: false}
  - {type: gear, a: sun2, b: planet2, teeth: [15, 15], module_mm: 1.2, external: true}
  - {type: gear, a: planet2, b: ring2, teeth: [15, 45], module_mm: 1.2, external: false}

center_distance_tol_mm: 0.2
