# 装配级 rubric：角色名与 offset_slider_crank.yaml 的 gold_roles 一致（由 bench_cases.py 生成）。
case_id: offset_slider_crank
ground: frame
mobility: 1
bodies:
  frame: [frame]
  crank: [shaft, crank]
  rod: [rod]
  slider: [slider]
flex:
  crank_pin: [crank, rod]
  wrist_pin: [rod, slider]
joints:
- bodies: [crank, frame]
  type: revolute
- bodies: [rod, crank]
  type: revolute
- bodies: [slider, rod]
  type: revolute
- bodies: [slider, frame]
  type: [slider, planar]
