# 装配级 rubric：角色名与 planetary_carrier.yaml 的 gold_roles 一致（由 bench_cases.py 生成）。
case_id: epicyclic_carrier_output
ground: frame
mobility: 1
bodies:
  frame: [frame, ring]
  input: [input_shaft, sun]
  carrier: [output_shaft, carrier]
  planet: [planet]
flex:
  planet_pin: [carrier, planet]
joints:
- bodies: [input, frame]
  type: revolute
- bodies: [carrier, frame]
  type: revolute
- bodies: [planet, carrier]
  type: revolute
couplings:
- type: gear
  a: sun
  b: planet
  teeth: [12, 18]
  module_mm: 2
  external: true
- type: gear
  a: planet
  b: ring
  teeth: [18, 48]
  module_mm: 2
  external: false
center_distance_tol_mm: 0.2
