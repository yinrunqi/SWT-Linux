# 装配级 rubric：角色名与 clock_motion.yaml 的 gold_roles 一致（由 bench_cases.py 生成）。
case_id: clock_motion_works
ground: frame
mobility: 1
bodies:
  frame: [frame]
  minute: [minute_arbor, cannon_pinion, minute_hand]
  wheel: [wheel_arbor, minute_wheel, minute_pinion]
  hour: [hour_tube, hour_wheel, hour_hand]
joints:
- bodies: [minute, frame]
  type: revolute
- bodies: [wheel, frame]
  type: revolute
- bodies: [hour, minute]
  type: revolute
couplings:
- type: gear
  a: cannon_pinion
  b: minute_wheel
  teeth: [10, 30]
  module_mm: 1.5
  external: true
- type: gear
  a: minute_pinion
  b: hour_wheel
  teeth: [8, 32]
  module_mm: 1.5
  external: true
center_distance_tol_mm: 0.2
