case_id: epicyclic_carrier_output
title: 单级行星减速器（行星架输出）
# 太阳轮 12 输入、齿圈 48 固定、行星架输出，i=5。
# 由 bench_cases.py 生成，改测例请改那里再运行 write。
parts:
- id: pc_frame
  extra_tools: []
  prompt: |
    创建箱体板：在 front_plane 上画矩形，X 从 -60 到 60 mm，Y 从 -60 到 60 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 10 mm。不要抽壳。
- id: pc_input_shaft
  extra_tools: []
  prompt: |
    创建输入轴：直径 10 mm、长 26 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: pc_output_shaft
  extra_tools: []
  prompt: |
    创建输出轴：直径 10 mm、长 20 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: pc_sun
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 12，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: pc_planet
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 18，压力角 30°，齿宽 8 mm，轴孔直径 6 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: pc_ring
  extra_tools:
  - internal_gear
  prompt: |
    创建渐开线内齿圈，模数 2 mm，齿数 48，压力角 30°，齿宽 8 mm，外径 106 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 internal_gear。
- id: pc_carrier
  extra_tools: []
  prompt: |
    创建行星架：外径 76 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 10 mm。另开贯穿孔：(30,0) 直径 6 mm。
- id: pc_planet_pin
  extra_tools: []
  prompt: |
    创建行星轮销：直径 6 mm、长 14 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
gold_roles:
  frame: pc_frame
  ring: pc_ring
  input_shaft: pc_input_shaft
  sun: pc_sun
  output_shaft: pc_output_shaft
  carrier: pc_carrier
  planet_pin: pc_planet_pin
  planet: pc_planet
assembly:
  prompt: |
    装配单级行星减速器（齿圈固定、行星架输出）。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - frame 固定，z∈[0,8]，主轴承孔 (0,0) 直径 10。48 齿内齿圈 ring 固定在 frame 上、与主轴承孔同轴（z∈[8,16]）。
    - input_shaft 穿过主轴承孔绕 Z 转动（z∈[-10,16]），12 齿 sun 固定在其上（z∈[8,16]）。
    - output_shaft 与主轴承孔同轴、绕 Z 转动（z∈[16,36]）；carrier 的中心孔固定在 output_shaft 上（z∈[16,22]）。
    - planet_pin 固定在 carrier 的 6 mm 偏心孔里、向 −Z 伸出（z∈[8,22]）；18 齿 planet 套在 planet_pin 上转动（z∈[8,16]），
      同时与 sun 外啮合、与 ring 内啮合（模数 2，中心距 30）。
    - 传动比 5：input_shaft 转 5 圈，carrier 同向转 1 圈。各齿轮互不穿模，啮合齿相位要对上。
    对 input_shaft 做 check_motion（一整圈），确认无穿模后再保存。
motion:
  driver: input_shaft
  sweep_deg: 360
  frames: 13
  rpm: 10
  expect_fixed:
  - frame
  expect_moving:
  - sun
  - planet
  - carrier
  ratios:
  - role: carrier
    ratio: 5
    same_direction: true
  max_interference: 0
