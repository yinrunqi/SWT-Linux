case_id: mechanical_iris_5blade
title: 五叶机械光圈（多位姿）
# 驱动环 + 5 组四杆叶片（分 3 层交叠），28 个组件、活动度 1；三个驱动环转角检查五个叶尖。
# 由 bench_cases2.py 生成，改测例请改那里再运行 write。
parts:
- id: ir_base
  extra_tools: []
  prompt: |
    创建底座：在 front_plane 上画矩形，X 从 -80 到 80 mm，Y 从 -80 到 80 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 10 mm，(60,0) 直径 6 mm，(18.54,57.06) 直径 6 mm，(-48.54,35.27) 直径 6 mm，(-48.54,-35.27) 直径 6 mm，(18.54,-57.06) 直径 6 mm。不要抽壳。
- id: ir_center
  extra_tools: []
  prompt: |
    创建中心轴：直径 10 mm、长 14 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: ir_actuator
  extra_tools: []
  prompt: |
    创建驱动环：外径 110 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 10 mm。另开贯穿孔：(45,0) 直径 6 mm，(13.91,42.8) 直径 6 mm，(-36.41,26.45) 直径 6 mm，(-36.41,-26.45) 直径 6 mm，(13.91,-42.8) 直径 6 mm。
- id: ir_blade
  extra_tools: []
  prompt: |
    创建叶片：在 front_plane 上画两端圆头的长条，宽 14 mm，两端半圆的圆心分别在原点和 (50,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=25 处直径 6 mm。
- id: ir_conn
  extra_tools: []
  prompt: |
    创建连杆：在 front_plane 上画两端圆头的长条，宽 10 mm，两端半圆的圆心分别在原点和 (25,0)，向 +Z 拉伸 6 mm。
    在 X 轴上开贯穿孔：X=0 处直径 6 mm，X=25 处直径 6 mm。
- id: ir_apin
  extra_tools: []
  prompt: |
    创建驱动销：直径 6 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: ir_bpin26
  extra_tools: []
  prompt: |
    创建叶片轴：直径 6 mm、长 26 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: ir_qpin12
  extra_tools: []
  prompt: |
    创建叶片销：直径 6 mm、长 12 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: ir_bpin32
  extra_tools: []
  prompt: |
    创建叶片轴：直径 6 mm、长 32 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: ir_qpin18
  extra_tools: []
  prompt: |
    创建叶片销：直径 6 mm、长 18 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: ir_bpin38
  extra_tools: []
  prompt: |
    创建叶片轴：直径 6 mm、长 38 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: ir_qpin24
  extra_tools: []
  prompt: |
    创建叶片销：直径 6 mm、长 24 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
