assembly:
  prompt: |
    装配五叶机械光圈：转动驱动环，五组"驱动销—连杆—叶片"四杆同时动作，叶片尖端向中心收拢或张开。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - base 固定，z∈[0,8]：中心孔 (0,0) 直径 10；五个叶片轴孔在半径 60 的圆上，第 k 个在 72·(k−1)° 方向（k=1 在 +X），直径 6。
    - center_pin 固定在中心孔里（z∈[0,14]）；actuator（驱动环）的中心孔套在 center_pin 上转动（z∈[8,14]）；
      actuator 上五个 6 mm 孔在半径 45 的圆上，第 k 个在局部 72·(k−1)° 方向。
    - 第 k 组（k=1..5）：bpin_k 固定在第 k 个叶片轴孔里，blade_k 的原点孔套在 bpin_k 上转动；apin_k 固定在 actuator 第 k 个孔里（z∈[8,20]），
      conn_k 的原点孔套在 apin_k 上转动（z∈[14,20]）；qpin_k 固定在 blade_k 的 X=25 孔里，conn_k 的另一孔套在 qpin_k 上。
    - 叶片分层：blade_1 z∈[20,26]；blade_2 z∈[26,32]；blade_3 z∈[20,26]；blade_4 z∈[26,32]；blade_5 z∈[32,38]；bpin_k 从 z=0 伸到所在叶片层顶面，qpin_k 从 z=14 伸到所在叶片层顶面。
    - 叶片从轴孔出发朝圆心一侧（顺时针方向）伸出，各叶片尖端在三个位姿下离中心约 41、22、11 mm。
    - 驱动环转角这 1 个自由度保持自由（整机活动度 1），不要固定。各件互不穿模，装好后保存。
