case_id: jansen_leg
title: Jansen 步行腿
# Strandbeest 八杆腿（两个三角刚体 + 6 根杆），12/36 齿轮驱动；检查脚尖步态包络与上三角摆角。
# 由 bench_cases2.py 生成，改测例请改那里再运行 write。
parts:
- id: jl_frame
  extra_tools: []
  prompt: |
    创建机架板：在 front_plane 上画矩形，X 从 -240 到 80 mm，Y 从 -210 到 100 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 10 mm，(48,0) 直径 10 mm，(-76,-15.6) 直径 6 mm。不要抽壳。
- id: jl_shaft
  extra_tools: []
  prompt: |
    创建轴：直径 10 mm、长 22 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: jl_gear
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 36，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: jl_pinion
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 12，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: jl_handwheel
  extra_tools: []
  prompt: |
    创建手轮：外径 40 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 10 mm。另开贯穿孔：(12,0) 直径 6 mm。
- id: jl_crank
  extra_tools: []
