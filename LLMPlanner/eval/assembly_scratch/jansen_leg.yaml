assembly:
  prompt: |
    装配 Theo Jansen 步行腿（Strandbeest 腿，经典 "holy numbers" 放大 2 倍）：曲柄一圈，脚尖走出扁平的 D 形步态。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - frame 固定，z∈[0,8]。曲柄轴孔 (0,0)、电机轴孔 (48,0) 直径 10；机架铰孔 A=(-76.0,-15.6) 直径 6。
    - shaft 穿过 (0,0) 孔绕 Z 转动（z∈[-8,14]）；36 齿 crank_gear 固定在其上（z∈[-8,0]）；crank 的 10 mm 孔固定在其上（z∈[8,14]）。
      crank_pin 固定在 crank 的 6 mm 孔里（z∈[8,26]）。
    - motor_shaft 穿过电机轴孔绕 Z 转动（z∈[-14,8]）；12 齿 pinion（z∈[-8,0]）与 handwheel 的中心孔（z∈[-14,-8]）固定在其上，与 crank_gear 外啮合。
    - 各杆都是两孔长条（孔径 6，原点孔在一端），长度：j=100.0、k=123.8、b=83.0、d=80.2、c=78.6、f=78.8、g=73.4、i=98.0。
    - a_pin 固定在 A 孔里（z∈[0,32]）。bar_b（z∈[8,14]）与 bar_d（z∈[14,20]）的原点孔都套在 a_pin 上，两杆固定成上三角（b、d 之间张角保持，
      b 端点 B 与 d 端点 D 相距 111.6）；bar_c 的原点孔也套在 a_pin 上转动（z∈[26,32]）。
    - b_pin 固定在 bar_b 的另一孔 B（z∈[8,20]）；bar_j 的原点孔套在 crank_pin 上（z∈[14,20]），另一孔套在 b_pin 上。
    - c_pin 固定在 bar_c 的另一孔 C（z∈[8,32]）；bar_k 的原点孔套在 crank_pin 上（z∈[20,26]），另一孔套在 c_pin 上。
    - bar_i（z∈[8,14]）与 bar_g（z∈[14,20]）的原点孔都套在 c_pin 上，两杆固定成腿三角（g 端点 E 与 i 端点 F 相距 131.4）。
    - d_pin 固定在 bar_d 的另一孔 D（z∈[8,20]），e_pin 固定在 bar_g 的另一孔 E（z∈[8,20]）；bar_f（z∈[8,14]）两孔分别套在 d_pin、e_pin 上。
    - foot 固定在 bar_i 的另一孔 F（z∈[8,20]）作为脚尖。
    - 装配分支：B 在 A 上方，C 在 A 下方，D 在 A 左侧，E 在 C 左侧，F（脚尖）在最下方。
      曲柄一整圈：脚尖 X 向行程约 135.8 mm、Y 向约 44.9 mm，上三角摆角约 56.5°。各齿轮互不穿模，啮合齿相位要对上。
    对 shaft 做 check_motion（一整圈），确认无穿模后再保存。
motion:
  driver: shaft
  sweep_deg: 360
  frames: 13
  rpm: 10
  expect_fixed:
  - frame
  expect_moving:
  - crank
  - bar_j
  - bar_k
  - bar_b
  - bar_c
  - bar_f
  - bar_i
  - foot
  ratios:
  - role: motor_shaft
    ratio: 0.3333333333333333
    same_direction: false
  swings:
  - role: bar_b
    deg: 56.5
  strokes:
  - role: foot
    axis: x
    mm: 135.82
  - role: foot
    axis: y
    mm: 44.91
  max_interference: 0
