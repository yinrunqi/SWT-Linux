case_id: turntable_ring_drive
title: 内齿圈转台
# 12 齿小齿轮内啮合 48 齿齿圈，齿圈与转台盘一体绕中心立轴转。
# 由 bench_cases.py 生成，改测例请改那里再运行 write。
parts:
- id: tt_frame
  extra_tools: []
  prompt: |
    创建底座板：在 front_plane 上画矩形，X 从 -70 到 70 mm，Y 从 -70 到 70 mm，向 +Z 拉伸 8 mm。
    开贯穿孔：(0,0) 直径 10 mm，(36,0) 直径 10 mm。不要抽壳。
- id: tt_spindle
  extra_tools: []
  prompt: |
    创建中心立轴：直径 10 mm、长 22 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: tt_pinion_shaft
  extra_tools: []
  prompt: |
    创建小齿轮轴：直径 10 mm、长 26 mm 的圆柱，轴线沿 Z，从 Z=0 向 +Z 拉伸。
- id: tt_pinion
  extra_tools:
  - spur_gear
  prompt: |
    创建渐开线直齿轮，模数 2 mm，齿数 12，压力角 30°，齿宽 8 mm，轴孔直径 10 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。
- id: tt_ring
  extra_tools:
  - internal_gear
  prompt: |
    创建渐开线内齿圈，模数 2 mm，齿数 48，压力角 30°，齿宽 8 mm，外径 110 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 internal_gear。
- id: tt_table
  extra_tools: []
  prompt: |
    创建转台盘：外径 110 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 10 mm。
gold_roles:
  frame: tt_frame
  spindle: tt_spindle
  pinion_shaft: tt_pinion_shaft
  pinion: tt_pinion
  ring: tt_ring
  table: tt_table
assembly:
  prompt: |
    装配内齿圈驱动的转台。不要把插入坐标当作最终位姿。所有转轴沿 Z；下面写的 z∈[a,b] 是零件装好后占的 Z 范围。
    - frame 固定，z∈[0,8]，孔 (0,0) 与 (36,0)，直径都是 10 mm。spindle 固定在 (0,0) 孔里（z∈[0,22]）。
    - pinion_shaft 穿过 (36,0) 孔绕 Z 转动（z∈[-10,16]），12 齿 pinion 固定在其上（z∈[8,16]）。
    - table 的中心孔套在 spindle 上绕 Z 转动（z∈[16,22]）；48 齿内齿圈 ring 固定在 table 下面（z∈[8,16]），与 table 同轴。
    - pinion 与 ring 内啮合（模数 2，中心距 36），转台转速为小齿轮的 1/4、同向。各齿轮互不穿模，啮合齿相位要对上。
    对 pinion_shaft 做 check_motion（一整圈），确认无穿模后再保存。
motion:
  driver: pinion_shaft
  sweep_deg: 360
  frames: 13
  rpm: 10
  expect_fixed:
  - frame
  expect_moving:
  - pinion
  - table
  ratios:
  - role: table
    ratio: 4
    same_direction: true
  max_interference: 0
