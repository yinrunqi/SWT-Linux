case: or_earth
prompt: "创建地球：外径 30 mm、厚 6 mm 的圆盘，轴线沿 Z，从 Z=0 向 +Z 拉伸，中心贯穿孔直径 8 mm。另开贯穿孔：(9,0) 直径 4 mm，(-9,0) 直径 4 mm。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.05}
entities:
  rim: {cylinder: {d: 30, side: outer}, count: 1}
  bore: {cylinder: {d: 8, side: inner}, count: 1}
  h0: {cylinder: {d: 4, side: inner}, count: 2}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - exists: rim
      - exists: bore
      - coaxial: [rim, bore]
      - through: {holes: bore}
      - extent_along: {axis: rim, of: all, value: 6}
      - exists: h0
      - through: {holes: h0}
      - axis_distance: {from: rim, to: h0, value: 9}
