case: lc_coupler
prompt: "创建λ 连杆：在 front_plane 上画两端圆头的长条，宽 14 mm，两端半圆的圆心分别在原点和 (100,0)，向 +Z 拉伸 6 mm。在 X 轴上开贯穿孔：X=0 处直径 8 mm，X=50 处直径 8 mm，X=100 处直径 8 mm。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.06}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 8, side: inner}, count: 3}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [6, 14, 114]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[7, 7], [57, 7], [107, 7]]}
