case: proj_shutter
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.05}
entities:
  rim: {cylinder: {d: 50, side: outer}, count: 1}
  bore: {cylinder: {d: 10, side: inner}, count: 1}
  windows: {cylinder: {d: 12, side: inner}, count: 2}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: size
    hard: true
    check:
      - exists: rim
      - exists: bore
      - coaxial: [rim, bore]
      - extent_along: {axis: rim, of: all, value: 3}
      - exists: windows
      - through: {holes: windows}
      - axis_distance: {from: rim, to: windows, value: 15}
      - equal_angular: {about: rim, items: windows}
