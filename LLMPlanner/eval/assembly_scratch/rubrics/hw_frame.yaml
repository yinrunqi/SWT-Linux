case: hw_frame
prompt: "创建支架板：在 front_plane 上画矩形，X 从 -30 到 80 mm，Y 从 -40 到 40 mm，向 +Z 拉伸 8 mm。开贯穿孔：(0,0) 直径 10 mm，(48,0) 直径 10 mm。不要抽壳。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 10, side: inner}, count: 2}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [8, 80, 110]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[30, 40], [78, 40]]}
