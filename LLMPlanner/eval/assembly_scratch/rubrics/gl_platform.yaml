case: gl_platform
prompt: "创建升降平台：在 front_plane 上画矩形，X 从 -50 到 50 mm，Y 从 -14 到 14 mm，向 +Z 拉伸 8 mm。开贯穿孔：(-36,0) 直径 10 mm，(36,0) 直径 10 mm。不要抽壳。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 10, side: inner}, count: 2}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [8, 28, 100]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[14, 14], [86, 14]]}
