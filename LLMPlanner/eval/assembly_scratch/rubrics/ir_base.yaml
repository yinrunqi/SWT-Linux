case: ir_base
prompt: "创建底座：在 front_plane 上画矩形，X 从 -80 到 80 mm，Y 从 -80 到 80 mm，向 +Z 拉伸 8 mm。开贯穿孔：(0,0) 直径 10 mm，(60,0) 直径 6 mm，(18.54,57.06) 直径 6 mm，(-48.54,35.27) 直径 6 mm，(-48.54,-35.27) 直径 6 mm，(18.54,-57.06) 直径 6 mm。不要抽壳。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 6, side: inner}, count: 5}
  h1: {cylinder: {d: 10, side: inner}, count: 1}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [8, 160, 160]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[140, 80], [98.54, 137.06], [31.46, 115.27], [31.46, 44.73], [98.54, 22.94]]}
      - exists: h1
      - through: {holes: h1}
      - axis_positions: {frame: wf, items: h1, axes: [0, 1], expect: [[80, 80]]}
