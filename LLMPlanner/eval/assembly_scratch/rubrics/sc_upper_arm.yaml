case: sc_upper_arm
prompt: "创建大臂：在 front_plane 上画两端圆头的长条，宽 30 mm，两端半圆的圆心分别在原点和 (150,0)，向 +Z 拉伸 10 mm。在 X 轴上开贯穿孔：X=0 处直径 10 mm，X=150 处直径 10 mm。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.06}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 10, side: inner}, count: 2}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [10, 30, 180]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[15, 15], [165, 15]]}
