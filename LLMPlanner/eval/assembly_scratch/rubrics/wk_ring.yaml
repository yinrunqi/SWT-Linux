case: wk_ring
prompt: "创建渐开线内齿圈，模数 2 mm，齿数 36，压力角 30°，齿宽 8 mm，外径 100 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 internal_gear。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.08}
entities:
  rim: {cylinder: {d: 100, side: outer}, count: 1}
  tframe: {axis_frame: {axis: rim}}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: rim
    hard: true
    check:
      - exists: rim
      - extent_along: {axis: rim, of: all, value: 8}
  - id: teeth
    hard: true
    check:
      - angular_openings: {frame: tframe, t_list: [4], scan_r: [35, 38, 0.25], count: 36, identical: true}
