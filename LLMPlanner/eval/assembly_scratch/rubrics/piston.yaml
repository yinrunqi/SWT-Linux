case: piston
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.05}
entities:
  od: {cylinder: {d: 24, side: outer}, count: 1}
  bore: {cylinder: {d: 10, side: inner}, count: 1}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: size
    hard: true
    check:
      - exists: od
      - exists: bore
      - coaxial: [od, bore]
      - extent_along: {axis: od, of: all, value: 30}
