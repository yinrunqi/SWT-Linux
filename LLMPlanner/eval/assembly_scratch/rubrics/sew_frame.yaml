case: sew_frame
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  bearings: {cylinder: {d: 10.4, side: inner}, count: 2}
  rocker_pivot: {cylinder: {d: 6.4, side: inner}, count: 1}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [8, 150, 180]
      - exists: bearings
      - through: {holes: bearings}
      - exists: rocker_pivot
      - through: {holes: rocker_pivot}
      - pair_distance: {items: bearings, value: 45}
