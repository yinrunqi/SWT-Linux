case: tc_base
prompt: "创建底座板：在 front_plane 上画矩形，X 从 -30 到 90 mm，Y 从 -40 到 30 mm，向 +Z 拉伸 8 mm。开贯穿孔：(0,0) 直径 6 mm，(60,-20) 直径 6 mm。不要抽壳。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 6, side: inner}, count: 2}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [8, 70, 120]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[30, 40], [90, 20]]}
