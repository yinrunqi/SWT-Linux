case: sg_planet
prompt: "创建渐开线直齿轮，模数 1.5 mm，齿数 20，压力角 30°，齿宽 6 mm，轴孔直径 6 mm，轴线沿 Z，从 Z=0 向 +Z 拉伸。优先 spur_gear。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.08}
entities:
  bore: {cylinder: {d: 6, side: inner}, count: 1}
  tframe: {axis_frame: {axis: bore}}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: bore
    hard: true
    check:
      - exists: bore
      - through: {holes: bore}
  - id: teeth
    hard: true
    check:
      - angular_openings: {frame: tframe, t_list: [3], scan_r: [13.5, 16.4, 0.188], count: 20, identical: true}
      - extent_along: {axis: bore, of: all, value: 6}
