case: cam_gear
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.08}
entities:
  bore: {cylinder: {d: 10, side: inner}, count: 1}
  tframe: {axis_frame: {axis: bore}}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: bore
    hard: true
    check:
      - exists: bore
      - through: {holes: bore}
  - id: teeth
    hard: true
    check:
      - angular_openings: {frame: tframe, t_list: [5], scan_r: [46, 51.2, 0.4], count: 32, identical: true}
