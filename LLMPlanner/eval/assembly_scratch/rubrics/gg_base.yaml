case: gg_base
prompt: "创建夹爪底座：在 front_plane 上画矩形，X 从 -60 到 60 mm，Y 从 -30 到 25 mm，向 +Z 拉伸 8 mm。开贯穿孔：(-15,0) 直径 10 mm，(15,0) 直径 10 mm，(-40.3,5.9) 直径 6 mm，(40.3,5.9) 直径 6 mm。不要抽壳。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 6, side: inner}, count: 2}
  h1: {cylinder: {d: 10, side: inner}, count: 2}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [8, 55, 120]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[19.7, 35.9], [100.3, 35.9]]}
      - exists: h1
      - through: {holes: h1}
      - axis_positions: {frame: wf, items: h1, axes: [0, 1], expect: [[45, 30], [75, 30]]}
