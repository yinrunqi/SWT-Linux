case: sew_feed_crank
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.06}
entities:
  big: {cylinder: {d: 10, side: inner}, count: 1}
  small: {cylinder: {d: 6, side: inner}, count: 1}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: holes
    hard: true
    check:
      - exists: big
      - exists: small
      - axis_distance: {from: big, to: small, value: 12}
      - through: {holes: big}
      - through: {holes: small}
      - bbox_sorted: [6, 14, 26]
