case: lamp_shade
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  pivot: {cylinder: {d: 5, side: inner}, count: 1}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [5, 16, 52]
      - exists: pivot
      - through: {holes: pivot}
