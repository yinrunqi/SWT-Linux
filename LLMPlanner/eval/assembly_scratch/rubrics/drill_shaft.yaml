case: drill_shaft
tolerance: {length_mm: 0.2, angle_deg: 1.0, volume_rel: 0.04}
entities:
  shank: {cylinder: {d: 4, side: outer}, count: 1}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: size
    hard: true
    check:
      - exists: shank
      - extent_along: {axis: shank, of: all, value: 22}
      - bbox_sorted: [4, 4, 22]
