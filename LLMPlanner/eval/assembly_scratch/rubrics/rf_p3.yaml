case: rf_p3
prompt: "创建远节指骨：在 front_plane 上画矩形，X 从 -13 到 34 mm，Y 从 -7 到 17 mm，向 +Z 拉伸 6 mm。开贯穿孔：(0,0) 直径 8 mm，(-8.73,10.94) 直径 4 mm。不要抽壳。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 4, side: inner}, count: 1}
  h1: {cylinder: {d: 8, side: inner}, count: 1}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [6, 24, 47]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[4.27, 17.94]]}
      - exists: h1
      - through: {holes: h1}
      - axis_positions: {frame: wf, items: h1, axes: [0, 1], expect: [[13, 7]]}
