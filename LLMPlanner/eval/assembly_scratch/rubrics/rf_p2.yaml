case: rf_p2
prompt: "创建中节指骨：在 front_plane 上画矩形，X 从 -12 到 48 mm，Y 从 -7 到 18 mm，向 +Z 拉伸 6 mm。开贯穿孔：(0,0) 直径 8 mm，(40,0) 直径 8 mm，(-7.27,11.96) 直径 4 mm。不要抽壳。"
tolerance: {length_mm: 0.25, angle_deg: 1.0, volume_rel: 0.04}
entities:
  wf: {world_frame: {}}
  h0: {cylinder: {d: 4, side: inner}, count: 1}
  h1: {cylinder: {d: 8, side: inner}, count: 2}
rubrics:
  - id: solid
    hard: true
    check:
      - single_valid_solid: {}
  - id: shape
    hard: true
    check:
      - bbox_sorted: [6, 25, 60]
      - exists: h0
      - through: {holes: h0}
      - axis_positions: {frame: wf, items: h0, axes: [0, 1], expect: [[4.73, 18.96]]}
      - exists: h1
      - through: {holes: h1}
      - axis_positions: {frame: wf, items: h1, axes: [0, 1], expect: [[12, 7], [52, 7]]}
