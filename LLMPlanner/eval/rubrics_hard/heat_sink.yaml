case: heat_sink
prompt: >-
  创建一个针状鳍片散热器，单一实体，Z 轴向上。底板是 100×100mm、厚 8mm 的正方形板（x、y ∈ [−50, 50]，z = 0~8），
  底板下表面中心凸出一块 60×60mm、厚 2mm 的导热接触台（z = −2~0）。底板上表面上按 10mm 间距排成 9×9 方阵的
  圆柱针鳍：针鳍直径 6mm、高 40mm（z = 8~48），圆心坐标 x、y 各取 −40、−30、…、30、40，但方阵 4 个角上的
  针鳍（(±40, ±40) 处）省去，共 77 根。省去针鳍的 4 个角上各开一个直径 4.5mm 的安装通孔，孔心 (±40, ±40)，
  孔口在底板上表面一侧有直径 8mm、深 4mm 的沉孔。
prompt_en: >-
  Create a pin-fin heat sink as a single solid body, with the Z axis pointing up. The base is a 100×100mm
  square plate 8mm thick (x, y ∈ [−50, 50], z = 0~8); a 60×60mm, 2mm-thick thermal contact pad protrudes from
  the center of its bottom face (z = −2~0). On the top face of the base, cylindrical pin fins are arranged in a
  9×9 square array with a 10mm pitch: each pin is 6mm in diameter and 40mm high (z = 8~48), and the pin centers
  take x and y values of −40, −30, …, 30, 40, except that the pins at the 4 corners of the array (at (±40, ±40))
  are omitted, leaving 77 pins. At each of these 4 corners there is a 4.5mm-diameter through mounting hole
  centered at (±40, ±40), with an 8mm-diameter, 4mm-deep counterbore at its mouth on the top-face side of the
  base.
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

# frame：主方向坐标系，原点在外形包围盒最小角。轴 0 沿高度，接触台底面（两端平面面积较大的一端）为 t = 0，
# 所以底板为 [2, 10]、针鳍为 [10, 50]；轴 1、轴 2 沿底板两边，底板中心在 (50, 50)。零件四重对称，轴向正负不影响探测。
entities:
  pins:     {cylinder: {d: 6, side: outer}, count: 77}
  mounts:   {cylinder: {d: 4.5, side: inner}, count: 4}
  cbores:   {cylinder: {d: 8, side: inner}, count: 4}
  frame:    {principal_frame: {signs: {0: larger_area_low}}}

rubrics:
  - id: solid
    source: 单一实体
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 100×100mm 底板；接触台底面到针鳍顶面 2 + 8 + 40 = 50mm
    hard: true
    check:
      - bbox_sorted: [50, 100, 100]

  - id: base
    source: 100×100mm、厚 8mm 的底板
    check:
      - line_material: {frame: frame, along: 0, at: [null, 5, 55], expect: [[2, 10]]}
      - line_material: {frame: frame, along: 1, at: [6, null, 55], expect: [[0, 100]]}

  - id: pad
    source: 底板下表面中心 60×60mm、厚 2mm 的接触台
    check:
      - line_material: {frame: frame, along: 0, at: [null, 55, 55], expect: [[0, 10]]}
      - line_material: {frame: frame, along: 1, at: [1, null, 55], expect: [[20, 80]]}
      - line_material: {frame: frame, along: 2, at: [1, 55, null], expect: [[20, 80]]}

  - id: pins
    source: 直径 6mm、高 40mm 的针鳍，共 77 根
    check:
      - exists: pins
      - line_material: {frame: frame, along: 0, at: [null, 60, 60], expect: [[0, 50]]}
      - line_material: {frame: frame, along: 0, at: [null, 10, 60], expect: [[2, 50]]}

  - id: pin_grid
    source: 10mm 间距的 9×9 方阵，圆心 x、y ∈ {−40, …, 40}；4 个角上的针鳍省去
    derivation: 针鳍高度中部横截：中间一行 9 根 [10k + 7, 10k + 13]；边行（y = ±40）去掉两端只剩 7 根
    check:
      - line_material: {frame: frame, along: 1, at: [30, null, 50],
                        expect: [[7, 13], [17, 23], [27, 33], [37, 43], [47, 53], [57, 63], [67, 73], [77, 83], [87, 93]]}
      - line_material: {frame: frame, along: 1, at: [30, null, 90],
                        expect: [[17, 23], [27, 33], [37, 43], [47, 53], [57, 63], [67, 73], [77, 83]]}
      - line_material: {frame: frame, along: 2, at: [30, 10, null],
                        expect: [[17, 23], [27, 33], [37, 43], [47, 53], [57, 63], [67, 73], [77, 83]]}

  - id: mount_holes
    source: 4 个角上 (±40, ±40) 处直径 4.5mm 安装通孔
    check:
      - exists: mounts
      - through: {holes: mounts}
      - axis_positions: {frame: frame, items: mounts, axes: [1, 2], expect: [[10, 10], [10, 90], [90, 10], [90, 90]]}
      - line_material: {frame: frame, along: 0, at: [null, 10, 10], expect: []}

  - id: counterbores
    source: 孔口在底板上表面一侧有直径 8mm、深 4mm 的沉孔
    check:
      - exists: cbores
      - coaxial: [cbores, mounts]
      - pocket_depth: {pocket: cbores, value: 4, probe_r: 3}
      - line_material: {frame: frame, along: 0, at: [null, 13, 10], expect: [[2, 6]]}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: 参考实体（OCC 布尔运算）体积 173226.2
    check:
      - volume: 173226.2

ungraded: []
