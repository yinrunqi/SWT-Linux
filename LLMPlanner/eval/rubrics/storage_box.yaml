case: storage_box
prompt: 创建顶部敞开的长方形收纳盒，外部 120×80×50mm，壁厚和底厚均为 8mm，顶部开口边做 R3mm 圆角。
prompt_en: >-
  Create an open-top rectangular storage box with outer dimensions of 120×80×50mm, a wall thickness and a
  bottom thickness of 8mm each, and R3mm fillets on the edges of the top opening.
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

# 0 = 高(50)，1 = 宽(80)，2 = 长(120)；底面（完整 9600）在高度 0，敞开端在 50。
entities:
  frame: {principal_frame: {up: open_end}}

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 外部 120×80×50mm
    hard: true
    check:
      - bbox_sorted: [50, 80, 120]

  - id: open_top
    source: 顶部敞开
    check:
      - extreme_plane: {frame: frame, axis: 0, side: low, min_area: 9500}   # 底面完整 120·80
      - first_hit: {frame: frame, from: [1.0, 0.5, 0.5], dir: "-0", value: 42}   # 从口部直落到腔底 50 − 8

  - id: walls
    source: 壁厚……均为 8mm
    check:
      - ray_thickness: {frame: frame, from: [0.5, 0.5, 0.5], dirs: ["+1", "-1", "+2", "-2"], value: 8}

  - id: bottom
    source: 底厚均为 8mm
    check:
      - ray_thickness: {frame: frame, from: [0.5, 0.5, 0.5], dirs: ["-0"], value: 8}

  - id: rim_fillet
    source: 顶部开口边做 R3mm 圆角
    derivation: 口沿的外圈或内圈边（或两圈）上的 R3 凸圆柱面，全部位于顶端 3mm 以内；每圈 4 条边
    check:
      - blend_faces: {radius: 3, side: outer, min_count: 4, near: {frame: frame, axis: 0, side: high, within: 3}}

  - id: volume
    source: 由以上尺寸确定，圆角做在哪一圈有不同读法
    derivation: >-
      无圆角 120·80·50 − 104·64·42 = 200448；
      内外两圈都倒 R3：外圈 400·(1 − π/4)·9 − 4·(2 − π/2 − 1/3)·27 = 762.2，
      内圈 336·(1 − π/4)·9 = 648.9，内角附加去料 ≤ 4·11.6，下限取 198990
    check:
      - volume_range: [198990, 200448]

ungraded:
  - source: 顶部开口边
    reason: 可指口沿外圈、内圈或两圈，只要求至少一圈做了 R3 圆角
