case: lidless_housing
prompt: 创建顶部敞开的壳体：外部 100×60×50mm，壁厚和底厚均为 5mm，用抽壳完成。
prompt_en: >-
  Create an open-top housing: outer dimensions 100×60×50mm, a wall thickness and a bottom thickness of 5mm
  each, made with a shell feature.
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

# 坐标系取自零件自身的主方向，轴按外形尺寸由短到长排列：0 = 高(50)，1 = 宽(60)，2 = 长(100)；
# 高度正方向指向端面平面面积较小的一端，即敞开端。
entities:
  frame: {principal_frame: {up: open_end}}

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 外部 100×60×50mm
    hard: true
    check:
      - bbox_sorted: [50, 60, 100]

  - id: open_top
    source: 顶部敞开
    check:
      - extreme_plane_areas: {frame: frame, axis: 0, values: [1500, 6000]}   # 口沿 100·60 − 90·50；底面完整

  - id: walls
    source: 壁厚……均为 5mm
    check:
      - ray_thickness: {frame: frame, from: [0.5, 0.5, 0.5], dirs: ["+1", "-1", "+2", "-2"], value: 5}

  - id: bottom
    source: 底厚均为 5mm
    check:
      - ray_thickness: {frame: frame, from: [0.5, 0.5, 0.5], dirs: ["-0"], value: 5}
      - first_hit: {frame: frame, from: [1.0, 0.5, 0.5], dir: "-0", value: 45}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: 100·60·50 − 90·50·45 = 97500
    check:
      - volume: 97500

ungraded:
  - source: 用抽壳完成
    reason: 建法指令，最终几何无法区分；它的几何后果已由 open_top、walls、bottom 覆盖

notes:
  - 旧 GT 腔深写成 44（体积 102000），应为 45（97500）。
