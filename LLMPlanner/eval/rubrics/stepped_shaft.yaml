case: stepped_shaft
prompt: 使用一次旋转创建总长 90mm 的三段阶梯轴：各段直径和长度依次为 35×40mm、50×30mm、25×20mm，轴向关于原点居中。
prompt_en: >-
  Using a single revolve, create a three-step shaft with an overall length of 90mm: the diameter × length of
  the steps, in order, are 35×40mm, 50×30mm and 25×20mm; the shaft is centered on the origin along its axis.
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

entities:
  s35: {cylinder: {d: 35, side: outer}, count: 1}
  s50: {cylinder: {d: 50, side: outer}, count: 1}
  s25: {cylinder: {d: 25, side: outer}, count: 1}

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 总长 90mm
    hard: true
    check:
      - bbox_sorted: [50, 50, 90]

  - id: segments
    source: 各段直径和长度依次为 35×40mm、50×30mm、25×20mm
    check:
      - exists: s35
      - exists: s50
      - exists: s25
      - coaxial: [s35, s50]
      - coaxial: [s25, s50]
      - extent_along: {axis: s35, of: s35, value: 40}
      - extent_along: {axis: s50, of: s50, value: 30}
      - extent_along: {axis: s25, of: s25, value: 20}
      - ordered_along: {axis: s50, items: [s35, s50, s25]}

  - id: centered
    source: 轴向关于原点居中
    check:
      - origin_centered: {axis: s50}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: π·(17.5²·40 + 25²·30 + 12.5²·20) = 34125π = 107206.8
    check:
      - volume: 107206.8

ungraded:
  - source: 使用一次旋转
    reason: 建法指令，最终几何无法区分
