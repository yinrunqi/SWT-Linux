case: open_box
prompt: 创建顶部敞开的盒体：外部 80×50×40mm，壁厚和底厚均为 4mm，用抽壳完成。
prompt_en: >-
  Create an open-top box: outer dimensions 80×50×40mm, a wall thickness and a bottom thickness of 4mm each,
  made with a shell feature.
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

# 0 = 高(40)，1 = 宽(50)，2 = 长(80)；底面（完整）在 0，敞开端在 40。
entities:
  frame: {principal_frame: {up: open_end}}

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 外部 80×50×40mm
    hard: true
    check:
      - bbox_sorted: [40, 50, 80]

  - id: open_top
    source: 顶部敞开
    check:
      - extreme_plane_areas: {frame: frame, axis: 0, values: [976, 4000]}   # 口沿 80·50 − 72·42；底面完整

  - id: walls
    source: 壁厚……均为 4mm
    check:
      - ray_thickness: {frame: frame, from: [0.5, 0.5, 0.5], dirs: ["+1", "-1", "+2", "-2"], value: 4}

  - id: bottom
    source: 底厚均为 4mm
    check:
      - ray_thickness: {frame: frame, from: [0.5, 0.5, 0.5], dirs: ["-0"], value: 4}
      - first_hit: {frame: frame, from: [1.0, 0.5, 0.5], dir: "-0", value: 36}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: 80·50·40 − 72·42·36 = 160000 − 108864 = 51136
    check:
      - volume: 51136

ungraded:
  - source: 用抽壳完成
    reason: 建法指令，最终几何无法区分；它的几何后果已由 open_top、walls、bottom 覆盖
