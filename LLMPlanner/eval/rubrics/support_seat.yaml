case: support_seat
prompt: >-
  创建轴支撑座，所有结构合并为单一实体。底座 100×50mm、厚 10mm；底座上表面中央立起厚 20mm 的立板，
  立板在底座 50mm 方向居中，正视轮廓为宽 50mm 的矩形加顶部 R25mm 半圆，半圆圆心距底座底面 40mm；
  在该圆心处开直径 24mm 的轴孔，沿立板厚度方向贯穿。
  底座上在 100mm 方向中线上、距中心 38mm 处左右各开一个直径 10mm 的贯穿孔。
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

# 底座坐标系：0 = 100mm 方向，1 = 50mm 方向（立板厚度方向），2 = 向上；原点在底面外廓中心。
entities:
  base:  {base_frame: {thickness: 10}}
  crown: {cylinder: {d: 50, side: outer}, count: 1}
  bore:  {cylinder: {d: 24, side: inner}, count: 1}
  holes: {cylinder: {d: 10, side: inner}, count: 2}

rubrics:
  - id: solid
    source: 所有结构合并为单一实体
    hard: true
    check:
      - single_valid_solid: {}

  - id: base
    source: 底座 100×50mm、厚 10mm
    hard: true
    check:
      - footprint: {frame: base, value: [100, 50]}
      - line_material: {frame: base, along: 2, at: [45, 20, null], expect: [[0, 10]]}

  - id: outer
    source: 由以上尺寸确定
    derivation: 40 + 25 = 65
    check:
      - total_height: {frame: base, value: 65}
      - bbox_sorted: [50, 65, 100]

  - id: plate
    source: 厚 20mm 的立板，在底座 50mm 方向居中，正视轮廓为宽 50mm 的矩形加顶部 R25mm 半圆，半圆圆心距底座底面 40mm
    derivation: x = 20 处顶高 40 + √(25² − 20²) = 55；z = 30 处轴孔弦半宽 √(12² − 10²) = 6.633
    check:
      - exists: crown
      - parallel_to_frame: {frame: base, items: crown, axis: 1}
      - line_material: {frame: base, along: 1, at: [0, null, 60], expect: [[-10, 10]]}
      - line_material: {frame: base, along: 2, at: [20, 0, null], expect: [[0, 55]]}
      - line_material: {frame: base, along: 0, at: [null, 0, 30], expect: [[-25, -6.633], [6.633, 25]]}

  - id: bore
    source: 在该圆心处开直径 24mm 的轴孔，沿立板厚度方向贯穿
    check:
      - exists: bore
      - coaxial: [bore, crown]
      - through: {holes: bore}
      - axis_positions: {frame: base, items: bore, axes: [0, 2], expect: [[0, 40]]}

  - id: holes
    source: 在 100mm 方向中线上、距中心 38mm 处左右各开一个直径 10mm 的贯穿孔
    check:
      - exists: holes
      - through: {holes: holes}
      - axis_positions: {frame: base, items: holes, axes: [0, 1], expect: [[-38, 0], [38, 0]]}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: >-
      底座 100·50·10 − 2·π·5²·10 = 48429.2；立板 (50·30 + π·25²/2 − π·12²)·20 = 40587.2；合计 89016.4
    check:
      - volume: 89016.4

ungraded: []
