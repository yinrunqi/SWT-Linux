case: flanged_elbow
prompt: >-
  创建带法兰的 90° 弯管。中心线是半径 40mm 的四分之一圆弧；管子外径 16mm、实心。
  两端各有外径 36mm、厚 4mm 的圆形法兰，法兰厚度沿管轴线向外凸出，中心孔与管子相贯。
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

entities:
  tube:    {torus: {major_r: 40, minor_r: 8, side: outer}, count: 1}
  flanges: {cylinder: {d: 36, side: outer}, count: 2}

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: tube_path
    source: 90° 弯管，中心线是半径 40mm 的四分之一圆弧；管子外径 16mm
    hard: true
    check:
      - exists: tube
      - sweep_angle: {torus: tube, value: 90}

  - id: tube_solid
    source: 实心
    check:
      - material_at: {centerline_of: tube, fractions: [0.25, 0.5, 0.75]}

  - id: flange_size
    source: 两端各有外径 36mm、厚 4mm 的圆形法兰
    check:
      - exists: flanges
      - extent_along: {axis: flanges, of: flanges, value: 4}

  - id: flange_placement
    source: 两端各有……法兰，法兰厚度沿管轴线向外凸出
    check:
      - flanges_at_arc_ends: {torus: tube, items: flanges, outward: [0, 4]}

  - id: bbox
    source: 由以上尺寸确定（中心孔不影响外廓）
    derivation: 一个方向 −4 … 40+18 = 58，共 62；法兰直径方向 36
    check:
      - bbox_sorted: [36, 62, 62]

  - id: volume
    source: 由以上尺寸确定，但中心孔是否存在有两种读法
    derivation: >-
      管 π·8²·20π = 12633.3；法兰实心 2·π·18²·4 = 8143.0 → 20776.3；
      法兰带 Ø16 通孔 2·π·(18² − 8²)·4 = 6534.5 → 19167.8
    check:
      - volume_range: [19167.8, 20776.3]

ungraded:
  - source: 中心孔与管子相贯
    reason: 管子是实心的，法兰“中心孔”是否存在、孔径和深度都无法由文字唯一确定

notes:
  - 旧 GT 包围盒 (36, 58, 58) 相当于法兰不向外凸出，与文字矛盾；按文字应为 (36, 62, 62)。
