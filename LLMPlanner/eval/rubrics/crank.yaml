case: crank
prompt: >-
  创建曲柄，所有结构合并为单一实体。轮毂为直径 36mm、长 24mm 的圆柱，中心有直径 16mm 的贯穿轴孔。
  曲柄臂垂直于轮毂轴线，厚 10mm，一个侧面与轮毂一个端面齐平；臂外形为以轮毂轴线为圆心的 R18mm 圆弧
  和以距轴线 60mm 处为圆心的 R11mm 圆弧，两圆弧由公切直线连接。
  在 R11mm 圆弧圆心处、臂与轮毂齐平的那一侧，凸起直径 22mm、高 15mm 的曲柄销座；
  销座中心开直径 10mm 的孔，贯穿销座和曲柄臂。
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

# kframe：轴 0 沿轮毂轴线，t = 0 在端部平面面积较大的一端，即轮毂不与臂齐平的端面
# （环面 π·(18² − 8²) = 816.8 > 销座端面 π·(11² − 5²) = 301.6）；轴 1 指向销座。
# 于是轮毂 t ∈ [0, 24]，臂 [14, 24]，销座 [24, 39]。
entities:
  hub:     {cylinder: {d: 36, side: outer}, count: 1}
  bore:    {cylinder: {d: 16, side: inner}, count: 1}
  arm_end: {cylinder: {d: 22, side: outer}, count: 1}
  pin:     {cylinder: {d: 10, side: inner}, count: 1}
  kframe:  {axis_frame: {axis: hub, low: larger_area, ref: arm_end}}

rubrics:
  - id: solid
    source: 所有结构合并为单一实体
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 由以上尺寸确定
    hard: true
    derivation: 沿轮毂轴线 24 + 15 = 39；指向销座 18 + 60 + 11 = 89；横向 36（在 kframe 中量）
    check:
      - frame_box: {frame: kframe, size: [39, 89, 36]}

  - id: hub
    source: 轮毂为直径 36mm、长 24mm 的圆柱，中心有直径 16mm 的贯穿轴孔
    check:
      - exists: hub
      - extent_along: {axis: hub, of: hub, value: 24}
      - exists: bore
      - coaxial: [bore, hub]
      - through: {holes: bore}

  - id: arm
    source: 曲柄臂垂直于轮毂轴线，厚 10mm，一个侧面与轮毂一个端面齐平
    check:
      - line_material: {frame: kframe, along: 0, at: [null, 35, 0], expect: [[14, 24]]}

  - id: profile
    source: 臂外形为 R18mm 圆弧和距轴线 60mm 处的 R11mm 圆弧，由公切直线连接
    derivation: 公切线法向 x 分量 (18 − 11)/60；x = 30 处半宽 (18 − 30·7/60)/√(1 − (7/60)²) = 14.600
    check:
      - exists: arm_end
      - parallel: [arm_end, hub]
      - axis_distance: {from: hub, to: arm_end, value: 60}
      - line_material: {frame: kframe, along: 2, at: [19, 30, null], expect: [[-14.6, 14.6]]}

  - id: pin_boss
    source: 在 R11mm 圆弧圆心处、臂与轮毂齐平的那一侧，凸起直径 22mm、高 15mm 的曲柄销座
    derivation: 销座与臂端圆弧同轴同径，二者连成一张圆柱面，轴向共 10 + 15 = 25
    check:
      - extent_along: {axis: arm_end, of: arm_end, value: 25}
      - line_material: {frame: kframe, along: 0, at: [null, 60, 8], expect: [[14, 39]]}

  - id: pin_hole
    source: 销座中心开直径 10mm 的孔，贯穿销座和曲柄臂
    check:
      - exists: pin
      - coaxial: [pin, arm_end]
      - through: {holes: pin}
      - line_material: {frame: kframe, along: 0, at: [null, 60, 0], expect: []}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: >-
      臂外形面积 ½·18²·(π + 2α) + ½·11²·(π − 2α) + 29·60·cos α = 2450.86，α = asin(7/60)；
      臂 10·(2450.86 − π·8² − π·5²) = 21712.6；轮毂其余 14·π·(18² − 8²) = 11435.4；
      销座 15·π·(11² − 5²) = 4523.9；合计 37671.9
    check:
      - volume: 37671.9

ungraded: []
