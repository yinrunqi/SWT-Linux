case: mug
prompt: 创建高 90mm、外径 70mm、壁厚 5mm、底厚 10mm 的圆柱形马克杯，并添加外径 40mm、条粗 8mm、厚 8mm 的环形把手。
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

# basis: explicit = 题面直接写明；implied = “马克杯/把手”这一名词的常识要求，单独汇报、不进主分。
entities:
  body:   {cylinder: {d: 70, side: outer}, count: 1}
  cavity: {cylinder: {d: 60, side: inner}, count: 1}
  handle: {ring: {outer_d: 40, section: [8, 8]}, count: 1}   # 圆截面 Ø8 或矩形截面 8×8 都算

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: body
    source: 高 90mm、外径 70mm 的圆柱形
    hard: true
    check:
      - exists: body
      - extent_along: {axis: body, of: all, value: 90}

  - id: cavity
    source: 壁厚 5mm、底厚 10mm
    check:
      - exists: cavity
      - coaxial: [cavity, body]
      - pocket_depth: {pocket: cavity, value: 80, blind: true, open_at_extreme: true}   # 底厚 = 90 − 80

  - id: handle_ring
    source: 外径 40mm、条粗 8mm、厚 8mm 的环形把手
    check:
      - exists: handle
      - genus: 1          # 把手与杯壁围成一个完整的指孔

  - id: volume
    source: 杯身完全确定；把手与杯壁的重叠量文字未给出
    derivation: >-
      杯身 π·(35²·90 − 30²·80) = 120165.9；把手最多 π·(20² − 12²)·8 = 6434.0
    check:
      - volume_range: [120165.9, 126599.9]

  - id: cavity_clear
    basis: implied
    source: 马克杯（杯腔可盛放）
    check:
      - no_material_in: {cylinder_of: cavity}

  - id: handle_orientation
    basis: implied
    source: 马克杯的把手
    check:
      - plane_contains_axis: {ring: handle, axis: body}   # 把手竖立在杯侧

ungraded:
  - source: 把手的高度位置、与杯壁的重叠量
    reason: 文字未给出；因此也不检查总包围盒

notes:
  - 旧 GT 包围盒 (70, 90, 100) 假设把手伸出 30mm，文字无此信息。
