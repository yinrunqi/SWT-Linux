case: flanged_bushing
prompt: 创建带法兰的衬套：套筒外径 20mm、内径 12mm、总长 30mm；一端带外径 36mm、厚 5mm 的法兰，法兰厚度计入总长；内孔全长贯通。
prompt_en: >-
  Create a flanged bushing: sleeve outer diameter 20mm, inner diameter 12mm, overall length 30mm; one end has
  a flange with an outer diameter of 36mm and a thickness of 5mm, the flange thickness being included in the
  overall length; the bore runs through the full length.
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

entities:
  sleeve: {cylinder: {d: 20, side: outer}, count: 1}
  bore:   {cylinder: {d: 12, side: inner}, count: 1}
  flange: {cylinder: {d: 36, side: outer}, count: 1}

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 总长 30mm；法兰外径 36mm
    hard: true
    check:
      - bbox_sorted: [30, 36, 36]

  - id: sleeve_and_flange
    source: 套筒外径 20mm；一端带外径 36mm、厚 5mm 的法兰，法兰厚度计入总长
    derivation: 套筒露出长度 30 − 5 = 25
    check:
      - exists: sleeve
      - exists: flange
      - coaxial: [flange, sleeve]
      - stepped_length: {axis: sleeve, inner_d: 20, outer_d: 36, inner_len: 25, outer_len: 5}

  - id: bore
    source: 内径 12mm；内孔全长贯通
    check:
      - exists: bore
      - coaxial: [bore, sleeve]
      - through: {holes: bore}
      - extent_along: {axis: bore, of: bore, value: 30}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: π·(10² − 6²)·25 + π·(18² − 6²)·5 = 5026.5 + 4523.9 = 9550.4
    check:
      - volume: 9550.4

ungraded: []
