case: rect_to_circle
prompt: 创建一个高 50mm 的过渡管：底面是 40×24mm 的矩形，顶面是直径 28mm 的圆，两截面平行且中心同轴，用放样连接。
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

# 0 = 宽（由顶圆定为 28），1 = 矩形长边方向(40)，2 = 高；高度 0 在矩形端（960 > 圆 615.8）。
entities:
  frame: {principal_frame: {signs: {2: larger_area_low}}}

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: outer
    source: 高 50mm；矩形长 40；圆径 28 大于矩形宽 24
    hard: true
    derivation: 宽度方向由顶圆决定为 28，放样侧面可能略外鼓，放宽到 29
    check:
      - bbox_sorted: [[28, 29], 40, 50]

  - id: bottom
    source: 底面是 40×24mm 的矩形
    check:
      - end_face_shape: {frame: frame, axis: 2, side: low, rect: [40, 24]}

  - id: top
    source: 顶面是直径 28mm 的圆
    check:
      - end_face_shape: {frame: frame, axis: 2, side: high, circle_d: 28}

  - id: coaxial
    source: 两截面平行且中心同轴
    check:
      - end_faces_coaxial: {frame: frame, axis: 2}

  - id: loft_body
    source: （隐含）放样实体：实心，截面由矩形到圆单调收小
    basis: implied
    check:
      - line_material: {frame: frame, along: 2, at: [14, 20, null], expect: [[0, 50]]}
      - section_areas: {frame: frame, axis: 2, at: [5, 25, 45], monotone: decreasing}

ungraded:
  - source: 用放样连接
    reason: 放样曲面形状与放样选项有关，体积不唯一；只检查端面与同轴
  - source: 过渡管
    reason: 未给壁厚，按实心放样体理解
