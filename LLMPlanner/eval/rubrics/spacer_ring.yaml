case: spacer_ring
prompt: 创建外径 40mm、内径 20mm、厚 10mm 的隔套，两个端面的外圆边都做 C1mm 倒角。
tolerance: {length_mm: 0.1, angle_deg: 0.5, volume_rel: 0.01}

entities:
  outer:    {cylinder: {d: 40, side: outer}, count: 1}
  inner:    {cylinder: {d: 20, side: inner}, count: 1}
  chamfers: {cone: {semi_angle: 45, side: outer, max_r: 20}, count: 2}

rubrics:
  - id: solid
    source: （隐含）一个零件
    hard: true
    check:
      - single_valid_solid: {}

  - id: ring
    source: 外径 40mm、内径 20mm、厚 10mm
    hard: true
    check:
      - exists: outer
      - exists: inner
      - coaxial: [inner, outer]
      - through: {holes: inner}
      - extent_along: {axis: outer, of: all, value: 10}
      - bbox_sorted: [10, 40, 40]

  - id: chamfers
    source: 两个端面的外圆边都做 C1mm 倒角
    check:
      - exists: chamfers
      - coaxial: [chamfers, outer]
      - cone_size: {cones: chamfers, radial: 1, axial: 1}
      - extent_along: {axis: outer, of: outer, value: 8}

  - id: volume
    source: 由以上尺寸完全确定
    derivation: π·(20² − 10²)·10 − 2·2π·(20 − 1/3)·0.5 = 9424.8 − 123.6 = 9301.2
    check:
      - volume: 9301.2

ungraded: []
