<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolidWorks LLM 自动建模 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>🔧 SolidWorks LLM 自动建模</h1>
    <div class="header-right">
      <button class="settings-toggle" id="settings-toggle" title="设置">⚙️</button>
      <div class="status">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">检查连接中…</span>
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings" id="settings">
    <div class="settings-row">
      <label for="api-key">API Key</label>
      <input id="api-key" type="password" placeholder="sk-..." autocomplete="off">
    </div>
    <div class="settings-row">
      <label for="base-url">Base URL <span class="hint">（可选，中转站选 Claude/GPT-5 系列必填）</span></label>
      <input id="base-url" type="text" value="https://api.juheai.top/v1" placeholder="https://api.openai.com/v1">
    </div>
    <div class="settings-row">
      <label for="model-select">模型</label>
      <select id="model-select">
        <optgroup label="⭐ 推荐（复合建模能力强）">
          <option value="basic/claude-sonnet-5" selected>claude-sonnet-5（推荐，Vision+复合规划最强，2/10 元/M）</option>
          <option value="basic/claude-opus-4-8">claude-opus-4-8（顶配，价格最高）</option>
        </optgroup>
        <optgroup label="OpenAI">
          <option value="gpt-4o">gpt-4o（原基线，简单零件够用）</option>
          <option value="gpt-4o-mini">gpt-4o-mini（快速，简单任务）</option>
          <option value="basic/gpt-5.6-terra">gpt-5.6-terra（GPT-5 系列，长上下文）</option>
        </optgroup>
        <optgroup label="其他">
          <option value="basic/claude-haiku-4-5-20251001">claude-haiku-4-5（快速版 Claude）</option>
          <option value="deepseek-v3.2-thinking">deepseek-v3.2-thinking（思考链）</option>
        </optgroup>
      </select>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat" id="chat">
    <div class="welcome">
      <h2>SolidWorks 自然语言建模助手</h2>
      <p>输入自然语言指令，AI 自动规划并执行 SolidWorks 建模操作</p>
      <div class="examples">
        <button onclick="useExample('创建一个 100mm x 50mm x 30mm 的长方体')">📦 长方体</button>
        <button onclick="useExample('画一个半径 20mm、高 50mm 的圆柱')">🔵 圆柱</button>
        <button onclick="useExample('创建一个边长 40mm 的正方体')">⬜ 正方体</button>
        <button onclick="useExample('在上表面画一个直径 15mm 的圆，向下切除 10mm')">🕳️ 挖孔</button>
        <button onclick="fillStorageBoxPrompt()">📦 收纳盒</button>
        <button onclick="fillDicePrompt()">🎲 标准骰子</button>
        <button onclick="fillHexNutPrompt()">🔩 六角螺母</button>
        <button onclick="fillMugPrompt()">☕ 马克杯</button>
        <button onclick="fillWrenchPrompt()">🔧 扳手</button>
        <button onclick="fillVasePrompt()">🏺 花瓶</button>
        <button onclick="fillKeyPrompt()">🔑 钥匙</button>
        <button onclick="fillGearPrompt()">⚙️ 齿轮</button>
      </div>
      <p class="examples-subtitle">🖼️ 多模态：从三视图图纸建模</p>
      <div class="examples" id="three-view-buttons">
        <!-- 由 app.js 的 renderThreeViewButtons() 根据 THREE_VIEW_SAMPLES 自动填充 -->
      </div>
    </div>
  </div>

  <!-- 拖拽上传覆盖层 -->
  <div class="drop-overlay" id="drop-overlay">
    <div class="drop-hint">
      <div class="drop-icon">📐</div>
      <div>松开上传三视图 / 图纸</div>
    </div>
  </div>

  <!-- 图片查看大图覆盖层 -->
  <div class="image-modal" id="image-modal" onclick="closeImageModal()">
    <img id="image-modal-img" alt="preview">
  </div>

  <!-- Input Bar -->
  <div class="input-bar-wrap">
    <!-- 图片预览条（有选中图片时显示） -->
    <div class="image-preview-bar" id="image-preview-bar" style="display: none;">
      <img id="image-preview-thumb" alt="thumb">
      <div class="image-preview-info">
        <div class="image-preview-name" id="image-preview-name"></div>
        <div class="image-preview-size" id="image-preview-size"></div>
      </div>
      <button class="image-preview-remove" id="image-preview-remove" title="移除">×</button>
    </div>
    <div class="input-bar">
      <input type="file" id="file-input" accept="image/*" style="display: none;">
      <button class="attach-btn" id="attach-btn" title="上传图纸（三视图 / 手绘 / 效果图）">📎</button>
      <textarea id="input" rows="3" placeholder="输入建模指令，或点 📎 / 拖入图纸文件。Enter 发送，Shift+Enter 换行。" autofocus></textarea>
      <button id="send-btn">发送</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
